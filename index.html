<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A pack-opening game: collect 420 real weapons from the Stone Age to today, ranked oldest to newest.">
<meta name="apple-mobile-web-app-title" content="Arsenal">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<!-- PAGE:START -->
<title>Arsenal of Ages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Arsenal of Ages
 * Layout: phone-first single column. Sticky resource bar on top, one scrolling
 * view, fixed tab bar at the bottom; on wide screens the column centres at 760px.
 * Look: a gunmetal armoury with brass fittings. One dark theme on purpose:
 * rarity colours glow against it.
 */
:root {
  --bg: #121519;
  --bg-2: #171b20;
  --panel: #1d2329;
  --panel-2: #252c33;
  --line: #333c45;
  --ink: #ece6d6;
  --ink-2: #bdb6a6;
  --muted: #84909a;
  --brass: #d9a441;
  --brass-hi: #f3c96e;
  --brass-ink: #221707;
  --good: #63d17a;
  --danger: #ff6159;
  --art-ink: #0d1115;
  --art-hl: rgba(255, 255, 255, 0.38);
  --font-display: 'Big Shoulders Stencil Display', Impact, 'Arial Narrow Bold', sans-serif;
  --font-body: 'Barlow Semi Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --tabs-h: 60px;
  /* Extra room under the last thing on a page or full-screen layer: inside the Claude app the
     bottom of the page can sit behind the app's own frame (while the app's header is showing),
     so the last buttons need to be able to scroll clear of it. */
  --bottom-room: 88px;
  /* Extra room inside the tab bar under the tabs: 0 normally. Inside an app on a phone
     ui.js sets it to how much of the page the app seems to be hiding at the bottom, so the
     tabs stay in view; when nothing is hidden it stays 0. */
  --dock-room: 0px;
  --radius: 10px;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
/* Quick repeated taps (selling duplicates, tapping the free pack) must not zoom the page on
   phones: no double-tap zoom anywhere, while scrolling and pinch-zoom still work. */
html, body, button, [data-act], label, select, input { touch-action: manipulation; }
button { -webkit-user-select: none; user-select: none; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.35;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, select:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 900; letter-spacing: 0.02em; text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

#app { max-width: 760px; margin: 0 auto; min-height: 100vh; position: relative; }

/* ── Resource bar ─────────────────────────────────────────── */
.hud {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 6px;
  padding: 10px 16px;
  background: linear-gradient(var(--bg) 70%, rgba(18, 21, 25, 0.92));
  border-bottom: 1px solid var(--line);
}
.pill {
  display: inline-flex; align-items: center; gap: 5px; min-width: 0; flex: none;
  height: 34px; padding: 0 9px; border-radius: 17px;
  background: var(--panel); border: 1px solid var(--line);
  font-weight: 700; font-size: 15.5px; white-space: nowrap;
}
#hud-cards { flex: 0 1 auto; overflow: hidden; }
.pill .of { color: var(--muted); font-weight: 600; }
@media (max-width: 420px) { .pill .of { display: none; } }
.pill svg { width: 18px; height: 18px; flex: none; }
.pill.coins { color: var(--brass-hi); }
.pill.coins.bump { animation: bump 0.25s ease; }
.pill.medals { color: #ffd76a; }
.hud .spacer { flex: 1; min-width: 0; }
.hud .free-mini {
  height: 34px; padding: 0 8px; flex: none; white-space: nowrap; border-radius: 17px; border: 1px solid var(--line);
  background: var(--panel); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
}
.hud .free-mini svg { width: 16px; height: 16px; }
.hud .free-mini.ready { background: var(--brass); color: var(--brass-ink); border-color: var(--brass-hi); animation: glow 1.4s ease-in-out infinite; }
.icon-btn {
  position: relative;
  width: 34px; height: 34px; border-radius: 17px; border: 1px solid var(--line); background: var(--panel);
  display: inline-grid; place-items: center; cursor: pointer; padding: 0; flex: none;
}
.icon-btn svg { width: 18px; height: 18px; }
@keyframes bump { 50% { transform: scale(1.08); } }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(243, 201, 110, 0.25); } }

/* ── Views ────────────────────────────────────────────────── */
#view { padding: 16px 16px calc(var(--tabs-h) + var(--dock-room) + 28px + env(safe-area-inset-bottom, 0px)); }
.view-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.view-title h1 { font-size: 30px; }
.view-sub { color: var(--ink-2); margin: 0 0 14px; max-width: 62ch; }
.section-label {
  font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); margin: 22px 0 10px; display: flex; align-items: center; gap: 10px;
}
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 42px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-2); font-weight: 700; font-size: 15px; cursor: pointer; white-space: nowrap;
}
.btn.primary { background: var(--brass); color: var(--brass-ink); border-color: var(--brass-hi); }
.btn.danger { background: #5c1f1c; border-color: #8a2e29; color: #ffd9d6; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn svg { width: 16px; height: 16px; }
.btn .coin-ico { width: 14px; height: 14px; }

/* ── Free pack ────────────────────────────────────────────── */
.free {
  display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center;
  width: 100%; padding: 14px; border-radius: 14px; cursor: pointer; text-align: left;
  border: 1px solid var(--line);
  background:
    repeating-linear-gradient(135deg, rgba(255,255,255,0.025) 0 10px, transparent 10px 20px),
    linear-gradient(160deg, #262d22, #1b2024);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  position: relative; overflow: hidden;
}
.free:active { transform: scale(0.985); }
.free.ready { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass), 0 0 28px rgba(217, 164, 65, 0.25); }
.free .crate-wrap { position: relative; width: 112px; height: 90px; }
.free .crate-wrap svg { width: 100%; height: 100%; }
.free.ready .crate-wrap { animation: wobble 1.6s ease-in-out infinite; }
.free .crate-wrap .ring { position: absolute; top: -6px; right: -6px; width: 34px; height: 34px; }
.free .free-txt { display: grid; min-width: 0; }
.free .free-title { font-family: var(--font-display); font-weight: 900; font-size: 24px; line-height: 1; }
.free .free-sub { color: var(--ink-2); font-weight: 600; font-size: 14px; margin-top: 3px; }
.free .timer { font-family: var(--font-display); font-weight: 900; font-size: 44px; line-height: 1; color: var(--brass-hi); margin: 6px 0 4px; }
.free.ready .timer { font-size: 30px; }
.free .hint { color: var(--ink-2); font-size: 14px; }
.floater {
  position: absolute; pointer-events: none; font-family: var(--font-display); font-weight: 900; font-size: 22px;
  color: var(--brass-hi); animation: floatUp 0.7s ease-out forwards; text-shadow: 0 2px 0 #000;
}
@keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-46px); } }
@keyframes wobble { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(-3deg); } 20% { transform: rotate(3deg); } 30% { transform: rotate(0); } }

/* ── Quantity + auto ──────────────────────────────────────── */
.qty-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.qty-row .lbl { color: var(--ink-2); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg button { min-width: 44px; height: 38px; border: 0; border-right: 1px solid var(--line); background: var(--panel); font-weight: 700; cursor: pointer; padding: 0 10px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--brass); color: var(--brass-ink); }

.auto-panel { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.auto-panel .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.auto-panel .status { color: var(--ink-2); font-size: 14px; margin-top: 8px; }
.auto-feed { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; min-height: 0; }
.auto-feed .chip { flex: none; }
select {
  height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  font: inherit; font-weight: 600; padding: 0 8px; max-width: 100%;
}
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 700; }
.switch input { appearance: none; -webkit-appearance: none; width: 46px; height: 26px; border-radius: 13px; background: #3a434c; position: relative; margin: 0; cursor: pointer; transition: background 0.15s; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); transition: transform 0.15s; }
.switch input:checked { background: var(--good); }
.switch input:checked::after { transform: translateX(20px); }

/* ── Pack rows ────────────────────────────────────────────── */
.packs { display: grid; gap: 10px; }
.pack {
  display: grid; grid-template-columns: 86px 1fr; gap: 12px; align-items: center;
  padding: 10px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line);
}
.pack .crate { width: 86px; height: 66px; }
.pack .crate svg { width: 100%; height: 100%; }
.pack .info { min-width: 0; }
.pack h3 { font-size: 21px; line-height: 1.05; }
.pack-head { display: flex; align-items: center; justify-content: space-between; gap: 4px 8px; flex-wrap: wrap; }
.mkt { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mkt.down { background: var(--good); color: #0b1a0f; }
.mkt.up { background: #6a2420; color: #ffd9d6; }
.mkt.flat { background: var(--panel-2); color: var(--ink-2); }
.pack .meta .perks { color: var(--brass-hi); font-weight: 600; }
.goal { margin-top: 10px; }
.goal-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 4px; }
.progress.win > i { background: linear-gradient(90deg, #ff3d63, #ffb800, #5cff8a, #3dd6ff, #b065f5); }
.won-note { margin-top: 8px; padding: 8px 12px; border-radius: 10px; background: #2b2410; border: 1px solid #6b5520; color: #f3c96e; font-weight: 700; }
.market-bar { display: flex; gap: 10px; align-items: flex-start; margin-top: 16px; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); font-size: 14px; }
.market-bar .mkt { font-size: 12px; padding: 0 5px; }
.mkt.mega { background: linear-gradient(90deg, #ffb800, #ff5a3d); color: #1d0a03; animation: glow 1.4s ease-in-out infinite; }
.mega-bar {
  display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-top: 16px;
  padding: 12px 14px; border-radius: 12px; border: 1px solid #ffb800; color: #fff1d0;
  background: linear-gradient(120deg, #4a2a06, #3a1412); box-shadow: 0 0 22px rgba(255, 184, 0, 0.22);
}
.mega-bar .btn { min-height: 38px; }
.pack.on-mega { border-color: #ffb800; box-shadow: 0 0 0 1px #ffb800, 0 0 22px rgba(255, 184, 0, 0.2); }
.mega-note { font-size: 13.5px; color: #ffe2a3; margin: -4px 0 8px; }
.pack .recent { font-size: 13px; color: #ffb4ad; margin: -4px 0 8px; }
.pack .recent:empty { display: none; }
.pack .meta { color: var(--ink-2); font-size: 14px; margin: 2px 0 8px; }
.pack .meta b { color: var(--ink); }
.pack .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pack .actions .btn { min-height: 38px; padding: 0 12px; }
.pack.locked { opacity: 0.55; }
.pack.locked .actions { color: var(--muted); font-weight: 600; font-size: 14px; }
.rar { font-weight: 700; color: var(--rc); white-space: nowrap; }

/* ── Cards ────────────────────────────────────────────────── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
.card {
  --rc: #999;
  position: relative; display: flex; flex-direction: column; gap: 4px;
  padding: 6px 6px 7px; border-radius: 9px; cursor: pointer; text-align: left; width: 100%; min-width: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 22%, #1a1f24) 0%, #161a1e 70%);
  border: 2px solid var(--rc);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
}
.card .c-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; }
.card .c-rank { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.stars { color: var(--rc); letter-spacing: -0.5px; font-size: 12px; white-space: nowrap; }
.stars i { font-style: normal; color: rgba(255,255,255,0.16); }
.card.missing .stars { visibility: hidden; }
.card .c-art {
  aspect-ratio: 1 / 0.82; border-radius: 6px; display: grid; place-items: center; overflow: hidden;
  background:
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 10px 10px,
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px) 0 0 / 10px 10px,
    radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--rc) 85%, white 10%) 0%, color-mix(in srgb, var(--rc) 45%, #000) 75%);
}
.card .c-art svg { width: 86%; height: 86%; color: var(--art-ink); }
.card .c-worth {
  position: absolute; right: 4px; bottom: 4px; z-index: 1;
  display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px 1px 3px; border-radius: 9px;
  background: rgba(10, 12, 15, 0.8); color: var(--brass-hi);
  font-weight: 700; font-size: 11.5px; line-height: 16px; font-variant-numeric: tabular-nums;
}
.card .c-art .c-worth svg { width: 12px; height: 12px; }
.card .pl { position: absolute; left: 4px; top: 4px; z-index: 1; padding: 0 5px; border-radius: 8px; background: rgba(10, 12, 15, 0.82); font-weight: 800; font-size: 11px; line-height: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.card .pl.up, .pl-line.up { color: #5cff8a; }
.card .pl.down, .pl-line.down { color: #ff7a7a; }
.ov-summary .pl-line b { color: inherit; }
.card.missing .c-worth { opacity: 0.65; }
.detail-card .card .c-worth { font-size: 15px; line-height: 20px; padding: 2px 8px 2px 4px; right: 6px; bottom: 6px; }
.detail-card .card .c-art .c-worth svg { width: 16px; height: 16px; }
.card .c-name { font-weight: 700; font-size: 13.5px; line-height: 1.12; min-height: 2.24em; overflow-wrap: anywhere; }
.card .c-meta { font-size: 11.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0 4px; }
.card .c-meta span { white-space: nowrap; }
.card .c-meta span:last-child { color: var(--rc); font-weight: 700; text-align: right; }
.card .badge {
  position: absolute; top: -9px; left: 50%; transform: translateX(-50%); z-index: 2; white-space: nowrap;
  font-family: var(--font-display); font-weight: 900; font-size: 13px; letter-spacing: 0.05em;
  padding: 1px 6px; border-radius: 5px; background: var(--good); color: #0b1a0f; box-shadow: 0 2px 0 rgba(0,0,0,0.4);
}
.card .badge.repeat { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }
.card .badge.scrap { background: var(--danger); color: #2a0806; }
.card .badge.up { background: linear-gradient(90deg, #ffb800, #ff8a3d); color: #2a1503; }
.card .count { position: absolute; bottom: 6px; right: 6px; font-weight: 700; font-size: 12px; background: rgba(0,0,0,0.6); padding: 0 5px; border-radius: 4px; }
.card.missing { background: #15191d; border-color: color-mix(in srgb, var(--rc) 35%, #2a3138); border-style: dashed; }
.card.missing .c-art { background: repeating-linear-gradient(135deg, #1b2025 0 6px, #181c21 6px 12px); }
.card.missing .c-art svg { color: color-mix(in srgb, var(--rc) 30%, #262d34); }
.card.missing .c-name { color: var(--muted); }
.card.locked-era { opacity: 0.5; }

/* tier flair */
.card.e5 { box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 14px color-mix(in srgb, var(--rc) 45%, transparent); }
.card.e6 { border-color: transparent; background-clip: padding-box; }
.card.e6::before {
  content: ''; position: absolute; inset: -2px; border-radius: 10px; z-index: -1; padding: 2px;
  background: conic-gradient(from var(--holo, 0deg), #ff3d63, #ffb800, #5cff8a, #3dd6ff, #b065f5, #ff3d63);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: holo 3s linear infinite;
}
.card.e6 { isolation: isolate; box-shadow: 0 0 18px rgba(255, 61, 99, 0.45); }
.card.missing.e6::before { opacity: 0.25; animation: none; }
.card.s5 .c-art::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%) -100% 0 / 250% 100% no-repeat;
  animation: shine 3.2s ease-in-out infinite;
}
.card .c-art { position: relative; }
.card.missing.s5 .c-art::after { display: none; }
@property --holo { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
@keyframes holo { to { --holo: 360deg; } }
@keyframes shine { 0%, 55% { background-position: 120% 0; } 100% { background-position: -120% 0; } }

/* mini chip for feeds */
.chip {
  --rc: #999; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px 3px 3px; border-radius: 6px;
  border: 1px solid var(--rc); background: color-mix(in srgb, var(--rc) 14%, var(--panel)); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip .mini { width: 26px; height: 26px; border-radius: 4px; display: grid; place-items: center; background: var(--rc); }
.chip .mini svg { width: 22px; height: 22px; color: var(--art-ink); }

/* ── Art strokes ──────────────────────────────────────────── */
.art { overflow: hidden; fill: currentColor; }
.art .s { fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; }
.art .m { fill: none; stroke: currentColor; stroke-width: 3.2; stroke-linecap: round; }
.art .t { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.art .ring { fill: none; stroke: currentColor; stroke-width: 6; }
.art .h { fill: var(--art-hl); }
.art .h.t, .art .h.s { fill: none; stroke: var(--art-hl); }
.art .beam { stroke: #fff6a8; stroke-width: 3.5; }
.art .w { fill: currentColor; fill: color-mix(in srgb, currentColor 68%, var(--rc, #8a9099)); }
.art .k { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
.art .k.h { fill: none; stroke: var(--art-hl); }
.art .k.w { fill: none; stroke: currentColor; stroke: color-mix(in srgb, currentColor 68%, var(--rc, #8a9099)); }

/* ── Collection ───────────────────────────────────────────── */
.progress { height: 10px; border-radius: 5px; background: var(--panel-2); overflow: hidden; border: 1px solid var(--line); }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass), var(--brass-hi)); border-radius: 5px; transition: width 0.3s; }
.era-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 14px -2px 6px; scrollbar-width: thin; }
.era-chip {
  --rc: #999; flex: none; display: grid; gap: 2px; padding: 8px 12px; border-radius: 10px; cursor: pointer; text-align: left;
  border: 1px solid var(--line); background: var(--panel); min-width: 112px;
}
.era-chip .n { font-family: var(--font-display); font-weight: 900; font-size: 18px; line-height: 1; }
.era-chip .r { font-size: 12.5px; font-weight: 700; color: var(--rc); }
.era-chip .c { font-size: 12.5px; color: var(--ink-2); }
.era-chip[aria-pressed="true"] { border-color: var(--rc); box-shadow: inset 0 0 0 1px var(--rc); background: color-mix(in srgb, var(--rc) 14%, var(--panel)); }
.era-chip .dot { position: relative; }
.era-chip.has-new .n::after { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-left: 6px; vertical-align: middle; }
.era-head { display: grid; gap: 6px; margin: 8px 0 14px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--rc); }
.era-head h2 { font-size: 26px; }
.era-head .line { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 14px; }
.star-rows { display: flex; flex-wrap: wrap; gap: 6px; }
.star-rows span { font-size: 13px; padding: 2px 8px; border-radius: 5px; background: var(--panel-2); font-variant-numeric: tabular-nums; }
.star-rows span.done { background: color-mix(in srgb, var(--rc) 30%, var(--panel-2)); }
.lock-note { padding: 12px 14px; border-radius: 10px; background: #2a2416; border: 1px solid #5b4a22; color: #f0dca8; margin-bottom: 14px; }

/* ── Storage ──────────────────────────────────────────────── */
.store-head { display: grid; gap: 8px; padding: 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.store-head .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.store-head .cap { font-family: var(--font-display); font-weight: 900; font-size: 28px; }
.store-head.full { border-color: var(--danger); }
.store-head.full .progress > i { background: var(--danger); }
.store-head .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.warn { color: var(--danger); font-weight: 700; }
.dupe-list { display: grid; gap: 8px; margin-top: 12px; }
.dupe {
  --rc: #999; display: grid; grid-template-columns: 48px 1fr auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--rc);
  position: relative;
}
.dupe .mini { width: 48px; height: 40px; border-radius: 6px; display: grid; place-items: center; background: radial-gradient(circle, var(--rc), color-mix(in srgb, var(--rc) 40%, #000)); }
.dupe .mini svg { width: 38px; height: 38px; color: var(--art-ink); }
.dupe .nm { font-weight: 700; line-height: 1.15; min-width: 0; overflow-wrap: anywhere; }
.dupe .sub { font-size: 13px; color: var(--ink-2); }
.dupe .btn { min-height: 38px; padding: 0 12px; }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 12px; margin-top: 12px; }

/* ── Tech tree ────────────────────────────────────────────── */
.tree-scroll { overflow: auto; margin: 0 -16px; padding: 4px 16px 16px; -webkit-overflow-scrolling: touch; }
.tree { position: relative; }
.tree svg.links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.tree svg.links path { fill: none; stroke: var(--line); stroke-width: 3; }
.tree svg.links path.on { stroke: var(--brass); }
.branch-label {
  position: absolute; width: 88px; text-align: center; font-family: var(--font-display); font-weight: 700;
  font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
}
.node {
  position: absolute; width: 88px; height: 92px; padding: 6px 4px 5px; border-radius: 12px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
  background: var(--panel); border: 2px solid var(--line); color: var(--ink);
}
.node .ico { width: 30px; height: 30px; display: grid; place-items: center; }
.node .ico svg { width: 28px; height: 28px; }
.node .ico svg.art { width: 34px; height: 34px; color: var(--ink); }
.node .nm { font-weight: 700; font-size: 12.5px; line-height: 1.05; flex: 1; display: grid; place-items: center; }
.node .lv { font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.node.locked { opacity: 0.45; }
.node.open { border-color: #4b5560; }
.node.open.afford { border-color: var(--brass); box-shadow: 0 0 0 3px rgba(217, 164, 65, 0.18); }
.node.open.afford .lv { color: var(--brass-hi); }
.node.part { background: linear-gradient(180deg, #2b2a20, var(--panel)); }
.node.maxed { background: linear-gradient(180deg, #4a3a16, #2a2412); border-color: var(--brass); }
.node.maxed .lv { color: var(--brass-hi); }
.node.era { border-color: var(--rc); }
.node.era.maxed { background: color-mix(in srgb, var(--rc) 28%, var(--panel)); }
.node.root { background: var(--panel-2); border-color: var(--brass); }
.prestige { margin-top: 22px; padding: 16px; border-radius: 14px; border: 1px solid #6b5520; background: linear-gradient(160deg, #2c2512, #1b1d1c); display: grid; gap: 8px; }
.prestige h2 { font-size: 26px; color: #ffd76a; }

/* ── Tabs ─────────────────────────────────────────────────── */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: center;
  background: #101317; border-top: 1px solid var(--line);
  padding: 0 8px env(safe-area-inset-bottom, 0px);
}
.tabs .inner { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 760px; }
.tabs { padding-bottom: calc(var(--dock-room) + env(safe-area-inset-bottom, 0px)); }
.tab {
  position: relative; height: var(--tabs-h); border: 0; background: none; cursor: pointer;
  display: grid; place-items: center; align-content: center; gap: 3px; color: var(--muted);
  font-weight: 700; font-size: 13px; letter-spacing: 0.04em;
}
.tab svg { width: 23px; height: 23px; }
@media (max-width: 360px) { .tab { font-size: 11.5px; letter-spacing: 0.01em; } }
.tab[aria-selected="true"] { color: var(--brass-hi); }
.tab[aria-selected="true"]::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 3px 3px; background: var(--brass); }
.tab .tb {
  position: absolute; top: 5px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--good); color: #0b1a0f; font-size: 11.5px; line-height: 18px; text-align: center;
}
.tab .tb.red { background: var(--danger); color: #2a0806; }
.tab .tb.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: 8px; background: var(--brass-hi); }

/* ── Bottom sheet ─────────────────────────────────────────── */
.sheet-back { position: fixed; inset: 0; z-index: 80; background: rgba(5, 7, 9, 0.6); display: flex; align-items: flex-end; justify-content: center; animation: fade 0.15s ease; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0;
  background: var(--bg-2); border: 1px solid var(--line); border-bottom: 0;
  padding: 18px 16px calc(20px + var(--bottom-room) / 2 + env(safe-area-inset-bottom, 0px)); animation: up 0.2s ease;
}
.sheet .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.sheet h2 { font-size: 28px; line-height: 1.05; }
.sheet p { margin: 8px 0; color: var(--ink-2); }
.sheet .stack { display: grid; gap: 10px; margin-top: 12px; }
.sheet .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; }
.sheet .kv dt { color: var(--muted); }
.sheet .kv dd { margin: 0; font-weight: 600; }
.detail-card { max-width: 230px; margin: 0 auto 6px; }
.detail-card .card { cursor: default; }
.detail-card .card .c-name { font-size: 18px; min-height: 0; }
.detail-card .card .c-top, .detail-card .card .c-meta { font-size: 14px; }
.detail-card .card .stars { font-size: 16px; }
.fact { font-size: 16px; color: var(--ink); line-height: 1.45; }
.odds-wrap { overflow-x: auto; margin-top: 8px; }
.odds { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.odds th, .odds td { padding: 5px 5px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.odds th:first-child, .odds td:first-child { text-align: left; }
.odds thead th { color: var(--muted); font-weight: 600; }
.odds td.zero { color: var(--muted); }
.odds tr.all td { border-top: 2px solid var(--line); border-bottom: 0; }
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }

/* ── Opening overlay ──────────────────────────────────────── */
.open-ov {
  position: fixed; inset: 0; z-index: 60; overflow: auto;
  background: radial-gradient(circle at 50% 30%, #23303a 0%, #0b0d10 70%);
  display: flex; flex-direction: column; align-items: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px));
}
.open-ov .ov-title { font-family: var(--font-display); font-weight: 900; font-size: 24px; letter-spacing: 0.06em; color: var(--ink-2); text-transform: uppercase; text-align: center; }
.open-ov .stage { flex: 1; width: 100%; max-width: 720px; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; gap: 16px; padding: 12px 0 var(--bottom-room); }
.open-ov .crate-big { width: min(62vw, 260px); }
.open-ov .crate-big svg { width: 100%; height: auto; }
.open-ov .crate-big.shake { animation: shake 0.5s ease-in-out infinite; }
.open-ov .crate-big.burst { animation: burst 0.35s ease-in forwards; }
.open-ov .flash { position: fixed; inset: 0; pointer-events: none; background: var(--fc, #fff); opacity: 0; }
.open-ov .flash.go { animation: flash 0.6s ease-out; }
.open-ov .reveal { width: 100%; display: grid; gap: 14px 8px; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); padding-top: 8px; margin: 0 auto; }
.open-ov .reveal.small { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 12px 6px; }
.open-ov .reveal.small .card .c-meta { display: none; }
.open-ov .card { padding-top: 11px; }
.open-ov .card .badge { font-size: 12px; line-height: 17px; padding: 0 5px; top: -10px; }
.open-ov .reveal.small .card .c-name { font-size: 11.5px; overflow-wrap: break-word; hyphens: auto; }
.open-ov .reveal.small .card .c-top { font-size: 10.5px; }
.open-ov .reveal.small .card .stars { font-size: 9.5px; letter-spacing: -1px; }
.open-ov .reveal.small .card .pl { font-size: 9.5px; padding: 0 3px; left: 2px; top: 2px; }
.open-ov .reveal.small .card .badge { font-size: 10.5px; padding: 0 4px; letter-spacing: 0; top: -8px; }
.flip { perspective: 800px; }
.flip .inner { position: relative; transition: transform 0.45s cubic-bezier(.2,.8,.3,1.2); transform-style: preserve-3d; }
.flip.down .inner { transform: rotateY(180deg); }
.flip .face, .flip .back { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
/* iPhone Safari lets badges inside the face show through the back, so the face is
   fully hidden while the card is down and swaps in when the card turns edge-on. */
.flip .face, .flip .back { transition: visibility 0s linear 0.07s; }
.flip.down .face { visibility: hidden; }
.flip:not(.down) .back { visibility: hidden; }
.flip .back {
  position: absolute; inset: 0; transform: rotateY(180deg); border-radius: 9px; border: 2px solid #4a4026;
  background:
    repeating-linear-gradient(45deg, rgba(217,164,65,0.10) 0 6px, transparent 6px 12px),
    radial-gradient(circle, #3a3220, #1d1a12);
  display: grid; place-items: center;
}
.flip .back span { font-family: var(--font-display); font-weight: 900; font-size: 34px; color: rgba(243, 201, 110, 0.5); }
.flip.deal { animation: deal 0.3s ease-out backwards; }
.big-banner {
  font-family: var(--font-display); font-weight: 900; font-size: clamp(30px, 9vw, 54px); letter-spacing: 0.04em; text-align: center;
  color: var(--bc, #fff); text-shadow: 0 0 24px var(--bc, #fff), 0 3px 0 #000; animation: pop 0.5s cubic-bezier(.2,1.6,.4,1);
}
.ov-summary { text-align: center; color: var(--ink-2); font-size: 16px; display: grid; gap: 4px; }
.ov-summary b { color: var(--ink); }
.ov-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; width: 100%; }
.ov-actions .btn { min-height: 50px; font-size: 17px; flex: 1 1 160px; max-width: 280px; }
@keyframes shake { 0%,100% { transform: rotate(0) } 20% { transform: rotate(-4deg) translateY(-2px) } 40% { transform: rotate(4deg) } 60% { transform: rotate(-3deg) translateY(-3px) } 80% { transform: rotate(3deg) } }
@keyframes burst { to { transform: scale(1.35); opacity: 0; } }
@keyframes flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
@keyframes deal { from { transform: translateY(40px) scale(0.85); opacity: 0; } }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } }

/* ── Toasts ───────────────────────────────────────────────── */
#toasts { position: fixed; z-index: 90; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top, 0px)); display: grid; justify-items: center; gap: 6px; pointer-events: none; padding: 0 16px; }
.toast {
  max-width: 440px; padding: 9px 14px; border-radius: 10px; background: #262d34; border: 1px solid var(--line);
  font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.45); animation: toastIn 0.2s ease, toastOut 0.3s ease 2.6s forwards;
}
.toast.good { border-color: var(--good); }
.toast.bad { border-color: var(--danger); }
.toast.gold { border-color: var(--brass); background: #2f2714; }
@keyframes toastIn { from { transform: translateY(-10px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-10px); opacity: 0; } }

.tip { margin-top: 14px; padding: 10px 12px; border-radius: 10px; border: 1px dashed #5b4a22; background: #211d13; color: #ecd9a6; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.tip button { margin-left: auto; flex: none; }

@media (min-width: 640px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); }
  .packs { grid-template-columns: 1fr 1fr; }
  #toasts { top: 70px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

/* ── Stats ────────────────────────────────────────────────── */
.st-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 6px; }
.st-tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; display: grid; justify-items: center; gap: 2px; text-align: center; }
.st-tile b { font-size: 20px; color: var(--brass-hi); white-space: nowrap; }
.st-tile span { font-size: 12.5px; color: var(--muted); }
.st-table { margin-top: 8px; }
.st-row { display: grid; grid-template-columns: 1fr minmax(76px, auto) minmax(76px, auto); gap: 10px; align-items: baseline; padding: 6px 2px; border-bottom: 1px solid var(--line); }
.st-row .st-v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.st-row.sub .st-l { padding-left: 14px; color: var(--ink-2); }
.st-row.sub .st-v { font-weight: 600; color: var(--ink-2); }
.st-head { border-bottom: 0; padding-bottom: 0; }
.st-head .st-v { font-size: 12.5px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
.st-sec { margin-top: 18px; padding: 0 2px 4px; font-size: 13px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); border-bottom: 1px solid var(--line); }
.runs { display: grid; gap: 10px; }
.run { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.run-top { display: flex; align-items: baseline; gap: 10px; }
.run-top .muted { margin-left: auto; font-size: 13px; }
.run-won { font-size: 13px; font-weight: 700; color: #ffd76a; }
.run-line { font-size: 14px; color: var(--ink-2); }
.run-line .gold { color: #ffd76a; }

/* ── Shiny cards and golden packs ─────────────────────────── */
.card.shiny { border-color: #eaf6ff; box-shadow: 0 0 0 1px rgba(255,255,255,0.45), 0 0 16px rgba(170, 220, 255, 0.5); }
.card.shiny::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  background: linear-gradient(115deg, transparent 25%, rgba(255, 90, 200, 0.28) 35%, rgba(90, 230, 255, 0.3) 45%,
    rgba(255, 245, 120, 0.3) 55%, rgba(120, 255, 160, 0.28) 65%, transparent 75%);
  background-size: 300% 100%; mix-blend-mode: color-dodge; animation: foil 3.2s linear infinite;
}
.card.shiny .badge { z-index: 3; }
.card .c-shiny {
  position: absolute; top: 3px; right: 5px; z-index: 2; font-size: 15px; line-height: 1; color: #fff;
  text-shadow: 0 0 6px #8fd8ff, 0 0 2px #fff;
}
@keyframes foil { from { background-position: 100% 0; } to { background-position: -200% 0; } }
.card.golden { border-color: #ffd23f; box-shadow: 0 0 0 2px rgba(255, 210, 63, 0.55), 0 0 22px rgba(255, 190, 40, 0.55); }
.open-ov .crate-big.golden svg { filter: sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 18px rgba(255, 200, 40, 0.85)); }
.gold-banner {
  font-family: var(--font-display); font-weight: 900; font-size: 22px; letter-spacing: 0.05em; text-align: center;
  padding: 6px 14px; border-radius: 10px; color: #2a1a00;
  background: linear-gradient(90deg, #ffe27a, #ffb800, #ffe27a); background-size: 200% 100%;
  box-shadow: 0 0 24px rgba(255, 196, 40, 0.55); animation: goldshine 1.6s linear infinite;
}
@keyframes goldshine { from { background-position: 0 0; } to { background-position: 200% 0; } }
.big-banner.shiny-banner {
  background: linear-gradient(90deg, #ff8ad8, #8fe3ff, #fff38a, #8dffb0, #ff8ad8); background-size: 300% 100%; color: #1a1030;
  text-shadow: none; padding: 4px 14px; border-radius: 12px; font-size: clamp(22px, 7vw, 44px); animation: goldshine 2.4s linear infinite;
}
.shiny-line { color: #bfe9ff; font-weight: 700; }
.gold-line { color: #ffd23f; font-weight: 700; }
.shiny-goal { display: flex; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 8px 10px; border-radius: 10px;
  background: linear-gradient(90deg, rgba(255, 138, 216, 0.12), rgba(143, 227, 255, 0.12), rgba(141, 255, 176, 0.12)); border: 1px solid rgba(191, 233, 255, 0.35); font-size: 15px; }

/* ── Skins ────────────────────────────────────────────────── */
.icon-btn.has-dot::after { content: ''; position: absolute; top: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--brass-hi); box-shadow: 0 0 0 2px var(--bg); }
.new-pill { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: 9px; background: var(--brass-hi); color: var(--brass-ink); font-size: 12.5px; line-height: 18px; vertical-align: 1px; }
.sk-sec { display: flex; justify-content: space-between; align-items: baseline; margin: 16px 0 8px; font-weight: 800; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.skins { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 8px; }
.skin {
  position: relative; display: grid; justify-items: center; align-content: start; gap: 4px; padding: 8px 6px; min-width: 0;
  border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: inherit; font: inherit; cursor: pointer; text-align: center;
}
.skin.using { border-color: var(--brass); box-shadow: inset 0 0 0 1px var(--brass); }
.skin.locked .sk-crate, .skin.locked .sk-back { opacity: 0.5; }
.sk-crate { width: 100%; max-width: 92px; }
.sk-crate svg { width: 100%; height: auto; display: block; }
.sk-name { font-weight: 800; font-size: 14px; line-height: 1.15; }
.sk-state { font-size: 12px; color: var(--ink-2); line-height: 1.25; }
.skin.using .sk-state { color: var(--brass-hi); font-weight: 700; }
.skin.locked .sk-state { color: var(--muted); }
.sk-state b { color: var(--ink-2); }
.sk-new { position: absolute; top: -7px; right: -4px; padding: 0 5px; border-radius: 8px; background: var(--good); color: #0b1a0f; font-size: 11px; font-weight: 800; line-height: 16px; }
.sk-back {
  width: 54px; aspect-ratio: 0.72; border-radius: 7px; border: 2px solid #4a4026; display: grid; place-items: center;
  background: repeating-linear-gradient(45deg, rgba(217,164,65,0.10) 0 6px, transparent 6px 12px), radial-gradient(circle, #3a3220, #1d1a12);
}
.sk-back span { font-family: var(--font-display); font-weight: 900; font-size: 22px; color: rgba(243, 201, 110, 0.5); }

/* Card backs (the standard one is .flip .back's own look) */
.flip .back.cb-camo, .sk-back.cb-camo {
  border-color: #2c311b;
  background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='36'><rect width='48' height='36' fill='%2356653a'/><path d='M2 4c6-4 14-2 16 4s-6 9-12 7S-3 8 2 4z' fill='%2338451f'/><path d='M26 2c7-2 14 2 13 7s-9 6-14 3-5-9 1-10z' fill='%237d7748'/><path d='M30 20c6-3 15 0 15 6s-8 8-14 6-7-9-1-12z' fill='%232c311b'/><path d='M6 22c5-2 12 1 12 5s-7 7-12 5-5-8 0-10z' fill='%237d7748'/><path d='M18 13c3-2 8-1 9 2s-3 5-6 4-6-4-3-6z' fill='%232c311b'/></svg>") 0 0 / 48px 36px, #56653a;
}
.flip .back.cb-camo span, .sk-back.cb-camo span { color: rgba(236, 230, 200, 0.6); }
.flip .back.cb-stars, .sk-back.cb-stars {

    let n = 0;
    const lo = era === undefined ? 0 : era * PER_ERA, hi = era === undefined ? CARD_COUNT : lo + PER_ERA;
    for (let i = lo; i < hi; i++) n += (s.stars[i] & starBit(star)) ? 1 : 0;
    return n;
  };
  PG.ownedInEra = function (s, era) {
    let n = 0;
    for (let i = era * PER_ERA; i < (era + 1) * PER_ERA; i++) n += s.owned[i] ? 1 : 0;
    return n;
  };

  const BULK = [1, 2, 3, 5, 10, 15, 20];
  PG.BULK = BULK;
  // The Auto-Opener's own steps: Auto Loader levels, then Assembly Line.
  const AUTO_STEPS = [1, 2, 3, 5, 10, 15];
  PG.AUTO_STEPS = AUTO_STEPS;
  const STORAGE = [20, 40, 80, 150, 300, 600, 1200, 2500, 5000, 10000];
  const SELL_RATE = [0.5, 1, 3, 10, 40, Infinity];
  const FREE_PACKS = ['supply', 'ammo', 'armory', 'warchest'];

  // Everything the tech tree and medals change, in one place.
  PG.stats = function (s) {
    const L = function (id) { return s.tech[id] || 0; };
    const owned = PG.ownedCount(s);
    const cv = PG.RULES.cardValue;
    const valueMult = 1 + cv[0] * L('val_1') + cv[1] * L('val_2') + (L('val_3') ? cv[2] * owned : 0) +
      cv[3] * L('val_4') + PG.RULES.medalValue * s.medals;
    const r = PG.RULES;
    return {
      freeTime: r.freeTimer - r.freeTimerStep * L('sup_timer'),
      tapPower: 1 + 0.5 * L('sup_tap'),
      freeStockMax: 1 + L('sup_stock'),
      freePack: FREE_PACKS[L('sup_better')],
      speedMult: (1 - 0.12 * L('spd_1')) * (1 - 0.10 * L('spd_2')),
      instantOwned: L('spd_instant') > 0,
      bulkMax: BULK[L('blk_1') + L('blk_2')],
      valueMult: valueMult,
      boughtValueMult: 1 + r.boughtValue * (valueMult - 1),
      luck: L('lck_1') + L('lck_2') + L('lck_3') + L('lck_4') + r.medalLuck * s.medals,
      extraCards: { small: L('qm_small'), mid: L('qm_mid'), big: L('qm_big'), era: L('qm_era') },
      discount: r.discountStep * L('qm_disc'),
      storageCap: STORAGE[L('sto_1') + L('sto_2')],
      sellMode: L('sto_sell'),
      autoSell: L('sto_auto') > 0,
      sellRate: L('sto_auto') ? SELL_RATE[L('sto_fast')] : 0,
      autoOpen: L('aut_1') > 0,
      autoDelay: r.autoWait - r.autoWaitStep * L('aut_2'),
      autoMax: L('aut_line') ? AUTO_STEPS[AUTO_STEPS.length - 1] : AUTO_STEPS[L('aut_load')],
      autoClaim: L('aut_claim') > 0,
      eras: PG.erasUnlocked(s),
      owned: owned
    };
  };

  PG.instantOn = function (s) { return PG.level(s, 'spd_instant') > 0 && s.settings.instant; };

  // Seconds the opening animation lasts for a batch of cards.
  PG.openSeconds = function (s, cardCount) {
    if (PG.instantOn(s)) return 0;
    const m = PG.stats(s).speedMult;
    const flips = 0.42 * Math.min(cardCount, 10) + 1.6 * Math.min(1, Math.max(0, cardCount - 10) / 40);
    return m * (1.1 + flips);
  };

  PG.autoInterval = function (s, cardCount) {
    const st = PG.stats(s);
    return Math.max(st.autoDelay, PG.instantOn(s) ? 0.4 : PG.openSeconds(s, cardCount));
  };

  // Coins for selling one copy of weapon `id` at `star` stars.
  PG.sellValue = function (s, id, star, st) {
    st = st || PG.stats(s);
    return Math.max(1, Math.round(PG.VALUE[PG.tierOf(PG.CARDS[id].era, star)] * st.valueMult));
  };

  // Base value of a storage key, for sorting.
  PG.keyValue = function (key) {
    const k = PG.parseKey(key);
    return PG.VALUE[PG.tierOf(PG.CARDS[k.id].era, k.star)];
  };

  // Storage keys look like "123:4" (weapon 123 at 4★).
  PG.dupeKey = function (id, star) { return id + ':' + star; };
  PG.parseKey = function (key) {
    const parts = String(key).split(':');
    return { id: +parts[0], star: +parts[1] };
  };

  // ── Packs and odds ───────────────────────────────────────────────────
  PG.packUnlocked = function (s, pack) { return PG.erasUnlocked(s) > pack.needEra; };

  // Star chances [1★..5★] for a given flattening (0 = base odds). A pack can bring its own
  // base odds (`starOdds`), which Luck then flattens the same way.
  PG.starOdds = function (boost, base) {
    const w = (base || PG.RULES.starOdds).map(function (p) { return Math.pow(p, 1 - boost); });
    const sum = w.reduce(function (a, b) { return a + b; }, 0);
    return w.map(function (x) { return x / sum; });
  };
  PG.starBoost = function (pack, luck) {
    return Math.min(PG.RULES.starBoostMax, (pack.starBoost || 0) + PG.RULES.starLuck * (luck || 0));
  };

  // Chance of each rarity + stars combination for one card from this pack: [{tier, p}], by tier.
  // o.free: a free pack (no bought-pack bonuses). o.minEra: only eras from this one up
  // (the guaranteed card of a bought pack).
  PG.packOdds = function (s, pack, st, o) {
    st = st || PG.stats(s);
    o = o || {};
    const bought = !o.free;
    const eraW = [];
    if (pack.eraOnly !== undefined) eraW.push({ era: pack.eraOnly, w: 1 });
    else {
      const first = pack.floor / 5;
      for (let e = first; e < st.eras; e++) if (!(e < o.minEra)) eraW.push({ era: e, w: Math.exp(-pack.k * 5 * (e - first)) });
    }
    const eraSum = eraW.reduce(function (a, x) { return a + x.w; }, 0);
    const stars = PG.starOdds(PG.starBoost(pack, (st.luck || 0) * (bought ? PG.RULES.boughtLuck : 1)), pack.starOdds);
    if (bought && pack.noOneStar) stars[0] = 0;
    else if (bought && pack.keepFiveStar) {
      const five = stars[4] / (1 - stars[0]);
      const rest = (1 - five) / (1 - stars[4]);
      for (let k = 0; k < 4; k++) stars[k] *= rest;
      stars[4] = five;
    }
    const rows = [];
    eraW.forEach(function (x) {
      const sw = stars.slice();
      if (x.era === ERA_COUNT - 1) sw[4] = pack.mythic5 ? sw[4] * PG.RULES.topTierPenalty : 0;
      const ss = sw.reduce(function (a, b) { return a + b; }, 0);
      sw.forEach(function (p, k) { if (p > 0) rows.push({ tier: x.era * 5 + k, p: (x.w / eraSum) * (p / ss) }); });
    });
    return rows;
  };

  // Average sell value of one card from this pack (before value upgrades).
  PG.packEV = function (s, pack, st, o) {
    let ev = 0;
    PG.packOdds(s, pack, st, o).forEach(function (r) { ev += r.p * PG.VALUE[r.tier]; });
    return ev;
  };

  // Era a bought pack's guaranteed card comes from (at least), or -1 when there is none.
  PG.guaranteeEra = function (s, pack, st) {
    st = st || PG.stats(s);
    if (pack.guarantee === undefined || pack.eraOnly !== undefined) return -1;
    return pack.guarantee > pack.floor / 5 && pack.guarantee < st.eras ? pack.guarantee : -1;
  };

  // Cards in a bought pack [min, max]. Each Packs-branch level raises the most it can hold by
  // half a card (a whole one for Deep Vaults): a max of 7½ means each pack has a 50% chance of
  // room for 8 instead of 7.
  PG.packCards = function (s, pack, st) {
    st = st || PG.stats(s);
    const x = (st.extraCards && st.extraCards[pack.group]) || 0;
    return [pack.min, pack.max + x * (PG.RULES.extraCardStep[pack.group] || 0)];
  };
  // Rolls how many cards one pack holds, every count in its range equally likely.
  function rollCount(range, rng) {
    const whole = Math.floor(range[1]), part = range[1] - whole;
    const top = part > 0 && rng() < part ? whole + 1 : whole;
    return range[0] + Math.floor(rng() * (top - range[0] + 1));
  }

  // Average base value (before value upgrades) of everything in one bought pack.
  // o.baseCards prices it with the pack's own card count (no upgrades).
  PG.packValue = function (s, pack, st, o) {
    st = st || PG.stats(s);
    o = o || {};
    const range = o.baseCards ? [pack.min, pack.max] : PG.packCards(s, pack, st);
    const cards = (range[0] + range[1]) / 2;
    const ev = PG.packEV(s, pack, st);
    const g = PG.guaranteeEra(s, pack, st);
    return g < 0 ? ev * cards : PG.packEV(s, pack, st, { minEra: g }) + ev * (cards - 1);
  };

  // Inside an era, weapon weights fall in a straight line from 1 (oldest) to newestWeight.
  const WEAPON_W = [];
  for (let i = 0; i < PER_ERA; i++) WEAPON_W.push(1 - (1 - PG.RULES.newestWeight) * i / (PER_ERA - 1));
  const WEAPON_SUM = WEAPON_W.reduce(function (a, b) { return a + b; }, 0);
  // Chance that a card of a given rarity is this particular weapon.
  PG.weaponShare = function (id) { return WEAPON_W[PG.CARDS[id].pos] / WEAPON_SUM; };
  function pickWeapon(era, rng) {
    let x = rng() * WEAPON_SUM;
    for (let i = 0; i < PER_ERA; i++) { x -= WEAPON_W[i]; if (x < 0) return era * PER_ERA + i; }
    return era * PER_ERA + PER_ERA - 1;
  }

  // Normal price of one pack: priced from base odds (no Luck, no upgrades) for the eras you have.
  const priceCache = {};
  PG.basePrice = function (s, pack) {
    if (pack.basePrice) return pack.basePrice;
    const eras = PG.erasUnlocked(s);
    const key = pack.id + eras;
    if (priceCache[key] === undefined) {
      const value = PG.packValue(s, pack, { luck: 0, eras: eras }, { baseCards: true });
      priceCache[key] = Math.max(10, nice(value * pack.markup));
    }
    return priceCache[key];
  };

  // Today's market multiplier for a pack (1 = normal price).
  PG.marketMult = function (s, packId) { return (s.market && s.market.mult[packId]) || 1; };

  // The Mega Sale running on this pack, if any: { pack, price, left }.
  PG.megaSale = function (s, packId) {
    const m = s.market && s.market.mega;
    return m && m.pack === packId && m.left > 0 ? m : null;
  };

  // Your normal price for a pack: it follows card values (value upgrades make the cards
  // inside worth more) and takes off your Bulk Buyer discount.
  PG.normalPrice = function (s, pack, st) {
    st = st || PG.stats(s);
    return PG.basePrice(s, pack) * (PG.RULES.priceFollowsValue ? st.valueMult : 1) * (1 - st.discount);
  };

  // Demand: packs you bought in the last few minutes, per pack, as [age in seconds, count]
  // batches (newest first). Past the free amount every extra pack makes that pack pricier;
  // the price comes back down as those purchases age out.
  const DEMAND_BATCH = 10;
  PG.recentBought = function (s, packId) {
    const list = s.market && s.market.recent && s.market.recent[packId];
    let n = 0;
    if (list) for (let i = 0; i < list.length; i++) n += list[i][1];
    return n;
  };
  PG.demandMult = function (s, packId) {
    const over = PG.recentBought(s, packId) - PG.RULES.demandFree;
    return over > 0 ? Math.pow(1 + PG.RULES.demandStep, over) : 1;
  };
  // How many more of a pack you can buy before its price starts to rise.
  PG.freeRoom = function (s, packId) {
    if (PG.megaSale(s, packId)) return Infinity;
    return Math.max(0, PG.RULES.demandFree - PG.recentBought(s, packId));
  };
  // Seconds until fewer than `below` recent purchases still count (default: until the
  // oldest one ages out).
  PG.demandEasesIn = function (s, packId, below) {
    const list = s.market && s.market.recent && s.market.recent[packId];
    let n = PG.recentBought(s, packId);
    if (below === undefined) below = n;
    for (let i = list ? list.length - 1 : -1; i >= 0 && n >= below; i--) {
      n -= list[i][1];
      if (n < below) return Math.max(0, PG.RULES.demandWindow - list[i][0]);
    }
    return 0;
  };
  function addDemand(s, packId, qty) {
    if (!s.market.recent) s.market.recent = {};
    const list = s.market.recent[packId] || (s.market.recent[packId] = []);
    if (list.length && list[0][0] < DEMAND_BATCH) list[0][1] += qty;
    else list.unshift([0, qty]);
  }
  function easeDemand(s, seconds) {
    const r = s.market.recent;
    if (!r) return;
    Object.keys(r).forEach(function (id) {
      const list = r[id].filter(function (b) { b[0] += seconds; return b[0] < PG.RULES.demandWindow; });
      if (list.length) r[id] = list; else delete r[id];
    });
  }

  // What a pack costs right now: your normal price moved by the market and by demand,
  // or the Mega Sale price.
  PG.packPrice = function (s, pack) {
    const mega = PG.megaSale(s, pack.id);
    if (mega) return mega.price;
    return Math.max(5, nice(PG.normalPrice(s, pack) * PG.marketMult(s, pack.id) * PG.demandMult(s, pack.id)));
  };

  // What the cards in one bought pack are worth on average, with your upgrades and Luck.
  PG.packWorth = function (s, pack, st) {
    st = st || PG.stats(s);
    return PG.packValue(s, pack, st) * st.boughtValueMult;
  };

  // Mega Sale price: low enough that, with your current upgrades and Luck, the cards
  // sell for about 140% of what you paid on average.
  function megaPrice(s, pack) {
    const st = PG.stats(s);
    const ev = PG.packWorth(s, pack, st);
    const normalLow = PG.normalPrice(s, pack, st) * PG.RULES.marketLow;
    return Math.max(5, nice(Math.min(ev / PG.RULES.megaPayback, normalLow)));
  }

  // New market prices: each pack drifts from where it was, pulled back toward normal.
  PG.rollMarket = function (s, rng) {
    rng = rng || Math.random;
    const r = PG.RULES;
    PG.PACKS.forEach(function (p) {
      const m = PG.marketMult(s, p.id);
      const next = 1 + (m - 1) * 0.6 + (rng() * 2 - 1) * 0.22;
      s.market.prev[p.id] = m;
      s.market.mult[p.id] = Math.round(Math.max(r.marketLow, Math.min(r.marketHigh, next)) * 100) / 100;
    });
    // A Mega Sale lasts until the next market change. Sometimes a new one starts on
    // the Doomsday Vault or Modern Pack (only ones you have unlocked).
    s.market.mega = null;
    const pool = PG.PACKS.filter(function (p) { return p.mythic5 && PG.packUnlocked(s, p); });
    if (pool.length && rng() < r.megaChance) {
      const pack = pool[Math.floor(rng() * pool.length)];
      s.market.mega = { pack: pack.id, price: megaPrice(s, pack), left: r.megaStock };
    }
    s.market.ver++;
  };

  function advanceMarket(s, seconds, rng) {
    s.market.timer -= seconds;
    let rolls = 0;
    while (s.market.timer <= 0) {
      if (rolls < 5) PG.rollMarket(s, rng);
      rolls++;
      s.market.timer += PG.RULES.marketPeriod;
    }
    return rolls;
  }

  // Rolls one card: { id, star }.
  PG.rollCard = function (odds, rng) {
    let x = rng();
    let tier = odds[odds.length - 1].tier;
    for (let i = 0; i < odds.length; i++) {
      x -= odds[i].p;
      if (x < 0) { tier = odds[i].tier; break; }
    }
    return { id: pickWeapon(Math.floor(tier / 5), rng), star: tier % 5 + 1 };
  };

  // Extra coins a duplicate from a bought pack pays at once: its value bonus a second time.
  function boughtBonus(id, star, st) {
    return Math.round(PG.VALUE[PG.tierOf(PG.CARDS[id].era, star)] * (st.boughtValueMult - st.valueMult));
  }

  // A copy you don't keep in the collection: sold, stored or scrapped. Duplicates pulled
  // from a bought pack (`bonus` holds the running total) also pay their bought-pack bonus.
  function spare(s, id, star, st, bonus) {
    const value = PG.sellValue(s, id, star, st);
    let fate = 'scrapped';
    if (st.autoSell && s.settings.autoSell && st.sellRate === Infinity) {
      s.coins += value; s.stats.earned += value;
      s.stats.sellCoins += value; s.stats.soldCards++;
      fate = 'sold';
    } else if (s.dupeTotal < st.storageCap) {
      const key = PG.dupeKey(id, star);
      s.dupes[key] = (s.dupes[key] || 0) + 1;
      s.dupeTotal++;
      fate = 'stored';
    } else s.stats.scrapped++;
    let extra = 0;
    if (bonus && fate !== 'scrapped') {
      extra = boughtBonus(id, star, st);
      s.coins += extra; s.stats.earned += extra;
      s.stats.bonusCoins += extra;
      bonus.coins += extra;
    }
    return { fate: fate, value: value, extra: extra };
  }

  // Puts one pulled card into the collection, storage or wallet. A star of a weapon you
  // don't have yet joins the collection ('new' for a new weapon, 'star' for a new star of
  // one you own); a star you already have is a duplicate.
  function receive(s, pull, st, out, bonus, rng) {
    const id = pull.id, star = pull.star;
    const tier = PG.tierOf(PG.CARDS[id].era, star);
    const shiny = rng() < PG.RULES.shinyChance;
    s.stats.cards++;
    if (tier > s.stats.bestTier) s.stats.bestTier = tier;
    if (star === 5) s.stats.fiveStars++;
    if (PG.CARDS[id].era === PG.ERAS.length - 1) s.stats.mythics++;
    const have = s.owned[id];
    const copies = ++s.copies[id * 5 + star - 1];
    if (!PG.hasStar(s, id, star)) {
      s.stars[id] |= starBit(star);
      if (star > have) s.owned[id] = star;
      s.unseen[id] = 1;
      if (have) s.stats.upgrades++; else s.stats.newWeapons++;
      const reward = Math.round(PG.sellValue(s, id, star, st) * PG.RULES.collectReward);
      s.coins += reward; s.stats.earned += reward;
      s.stats.rewardCoins += reward;
      out.push({ id: id, star: star, fate: have ? 'star' : 'new', prev: have, value: reward, copies: copies });
      if (!s.wonAt && s.stars[id] === ALL_STARS && PG.hasWon(s)) { s.wonAt = Date.now(); out.won = true; }
    } else {
      s.stats.dupes++;
      const r = spare(s, id, star, st, bonus);
      out.push({ id: id, star: star, fate: r.fate, value: r.value, extra: r.extra, copies: copies });
    }
    if (shiny) {
      // A shiny copy pays (shinyMult - 1) times its value on top, and adds the weapon to the
      // shiny collection.
      const last = out[out.length - 1];
      const coins = PG.sellValue(s, id, star, st) * (PG.RULES.shinyMult - 1);
      s.coins += coins; s.stats.earned += coins;
      s.stats.shinies++; s.stats.shinyCoins += coins;
      last.shiny = true;
      last.shinyCoins = coins;
      last.shinyNew = !s.shiny[id];
      s.shiny[id] = 1;
    }
  }

  // Opens `count` packs; each one rolls its own card count. Free packs use the free range
  // and none of the bought-pack bonuses. In a bought pack the first card is the guaranteed one.
  // `golden` is the index of a golden pack in the batch (or -1): its first card is a 5★ from
  // what the pack can hold. The returned list carries `bonus`: coins paid by bought-pack
  // duplicates.
  function openPacks(s, pack, count, rng, free, golden) {
    const st = PG.stats(s);
    const opt = { free: free };
    const odds = PG.packOdds(s, pack, st, opt);
    const g = free ? -1 : PG.guaranteeEra(s, pack, st);
    const top = g < 0 ? odds : PG.packOdds(s, pack, st, { minEra: g });
    const range = free ? PG.RULES.freeCards : PG.packCards(s, pack, st);
    const bonus = free ? null : { coins: 0 };
    const out = [];
    for (let n = 0; n < count; n++) {
      const cards = rollCount(range, rng);
      for (let c = 0; c < cards; c++) {
        const isGolden = n === golden && c === 0;
        receive(s, PG.rollCard(isGolden ? goldenOdds(top) : c === 0 ? top : odds, rng), st, out, bonus, rng);
        out[out.length - 1].pk = n;   // which pack of the batch this card came from
        if (isGolden) out[out.length - 1].golden = true;
      }
    }
    if (golden >= 0) s.stats.goldenPacks++;
    s.stats.packs += count;
    if (free) s.stats.freePacks += count;
    out.bonus = bonus ? bonus.coins : 0;
    return out;
  }

  // A golden pack's special card: only the 5★ rows of the pack's odds (so a pack that can't
  // give Mythical 5★ still can't).
  function goldenOdds(odds) {
    const five = odds.filter(function (o) { return o.tier % 5 === 4 && o.p > 0; });
    const sum = five.reduce(function (a, o) { return a + o.p; }, 0);
    return five.map(function (o) { return { tier: o.tier, p: o.p / sum }; });
  }
  // A pack opening you start yourself (not the Auto-Opener) turns golden now and then: one of
  // its packs, picked at random.
  function rollGolden(qty, rng, o) {
    return o && o.manual && rng() < PG.RULES.goldenChance ? Math.floor(rng() * qty) : -1;
  }

  // How many of this pack you can open right now (respecting coins and bulk limit).
  PG.affordable = function (s, packId, wanted) {
    const pack = PG.PACK_BY_ID[packId];
    if (!pack || !PG.packUnlocked(s, pack)) return 0;
    const mega = PG.megaSale(s, packId);
    const max = Math.min(wanted, PG.stats(s).bulkMax, mega ? mega.left : Infinity);
    return Math.max(0, Math.min(max, Math.floor(s.coins / PG.packPrice(s, pack))));
  };

  PG.buyPacks = function (s, packId, qty, rng, o) {
    const pack = PG.PACK_BY_ID[packId];
    if (!pack) return { ok: false, reason: 'No such pack.' };
    if (!PG.packUnlocked(s, pack)) return { ok: false, reason: 'Unlock the ' + PG.ERAS[pack.needEra].name + ' era first.' };
    const st = PG.stats(s);
    const mega = PG.megaSale(s, packId);
    qty = Math.max(1, Math.min(qty | 0, st.bulkMax, mega ? mega.left : Infinity));
    const cost = PG.packPrice(s, pack) * qty;
    if (s.coins < cost) return { ok: false, reason: 'Not enough coins.' };
    s.coins -= cost;
    s.stats.spent += cost;
    s.stats.packSpent += cost;
    if (mega) {
      s.stats.megaPacks += qty;
      mega.left -= qty;
      if (mega.left <= 0) s.market.mega = null;
      s.market.ver++;
    } else addDemand(s, packId, qty);
    rng = rng || Math.random;
    const golden = rollGolden(qty, rng, o);
    const results = openPacks(s, pack, qty, rng, false, golden);
    return { ok: true, pack: pack, qty: qty, cost: cost, mega: !!mega, results: results, bonus: results.bonus, won: !!results.won, golden: golden };
  };

  // ── Free packs ───────────────────────────────────────────────────────
  PG.openFree = function (s, rng, o) {
    const st = PG.stats(s);
    const qty = Math.min(s.free.stock, st.bulkMax);
    if (qty <= 0) return null;
    s.free.stock -= qty;
    const pack = PG.PACK_BY_ID[st.freePack];
    rng = rng || Math.random;
    const golden = rollGolden(qty, rng, o);
    const results = openPacks(s, pack, qty, rng, true, golden);
    return { ok: true, pack: pack, qty: qty, cost: 0, free: true, results: results, bonus: 0, won: !!results.won, golden: golden };
  };

  function advanceFree(s, seconds, st) {
    if (s.free.stock >= st.freeStockMax) { s.free.timer = st.freeTime; return 0; }
    let made = 0;
    s.free.timer -= seconds;
    while (s.free.timer <= 0 && s.free.stock < st.freeStockMax) {
      s.free.stock++; made++;
      s.free.timer += st.freeTime;
    }
    if (s.free.stock >= st.freeStockMax) s.free.timer = st.freeTime;
    return made;
  }

  // A tap on the free pack timer. Returns true when it made a pack ready.
  PG.tapFree = function (s) {
    const st = PG.stats(s);
    if (s.free.stock >= st.freeStockMax) return false;
    s.stats.taps++;
    return advanceFree(s, st.tapPower, st) > 0;
  };

  PG.applyOffline = function (s, seconds) {
    if (!(seconds > 0)) return 0;
    advanceMarket(s, seconds);
    easeDemand(s, seconds);
    return advanceFree(s, Math.min(seconds, 7 * 24 * 3600), PG.stats(s));
  };

  // ── Selling ──────────────────────────────────────────────────────────
  // Sells n copies from a storage key ("id:star").
  PG.sellDupe = function (s, key, n) {
    const have = s.dupes[key] || 0;
    n = Math.min(have, n === undefined ? 1 : n);
    if (n <= 0) return 0;
    const k = PG.parseKey(key);
    const coins = n * PG.sellValue(s, k.id, k.star);
    s.dupes[key] = have - n;
    if (!s.dupes[key]) delete s.dupes[key];
    s.dupeTotal -= n;
    s.coins += coins; s.stats.earned += coins;
    s.stats.sellCoins += coins; s.stats.soldCards += n;
    return coins;
  };

  PG.sellAll = function (s) {
    let total = 0;
    Object.keys(s.dupes).forEach(function (k) { total += PG.sellDupe(s, k, s.dupes[k]); });
    return total;
  };

  // Auto-seller sells the most valuable duplicates first.
  function sellHighest(s, n) {
    let total = 0;
    const keys = Object.keys(s.dupes).sort(function (a, b) { return PG.keyValue(b) - PG.keyValue(a); });
    for (let i = 0; i < keys.length && n > 0; i++) {
      const take = Math.min(n, s.dupes[keys[i]]);
      total += PG.sellDupe(s, keys[i], take);
      n -= take;
    }
    return total;
  }

  // ── Tech ─────────────────────────────────────────────────────────────
  PG.techCost = function (s, id) {
    const node = PG.TECH_BY_ID[id];
    const lvl = PG.level(s, id);
    return lvl >= node.max ? null : node.costs[lvl];
  };

  // What still blocks this node (empty list = you can buy it if you have the coins).
  PG.techBlockers = function (s, id) {
    const node = PG.TECH_BY_ID[id];
    const out = [];
    node.req.forEach(function (r) {
      const parent = PG.TECH_BY_ID[r];
      if (node.reqFull && PG.level(s, r) < parent.max) out.push('Needs ' + parent.name + ' fully upgraded');
      else if (!PG.level(s, r)) out.push('Needs ' + parent.name);
    });
    if (node.needEra && PG.erasUnlocked(s) <= node.needEra) out.push('Needs the ' + PG.ERAS[node.needEra].name + ' era');
    if (node.needCards) {
      const have = PG.ownedInEra(s, node.needCards.era);
      if (have < node.needCards.count) {
        out.push('Collect ' + node.needCards.count + ' ' + PG.ERAS[node.needCards.era].name + ' cards (' + have + '/' + node.needCards.count + ')');
      }
    }
    return out;
  };

  PG.techState = function (s, id) {
    if (PG.techCost(s, id) === null) return 'maxed';
    return PG.techBlockers(s, id).length ? 'locked' : 'open';
  };

  PG.buyTech = function (s, id) {
    const cost = PG.techCost(s, id);
    if (cost === null) return { ok: false, reason: 'Already maxed.' };
    const blockers = PG.techBlockers(s, id);
    if (blockers.length) return { ok: false, reason: blockers[0] + '.' };
    if (s.coins < cost) return { ok: false, reason: 'Not enough coins.' };
    s.coins -= cost;
    s.stats.spent += cost;
    s.stats.techSpent += cost;
    s.stats.techBought++;
    s.tech[id] = PG.level(s, id) + 1;
    return { ok: true, level: s.tech[id] };
  };

  // ── Skins ────────────────────────────────────────────────────────────
  // Looks only: a crate skin repaints every crate, a card back changes the back of cards
  // before they flip. Each one unlocks at a milestone and stays unlocked for good.
  function wins(s) { return s.runs.filter(function (r) { return r.won; }).length + (s.wonAt ? 1 : 0); }
  function shinyTotal(s) { let n = 0; for (let i = 0; i < CARD_COUNT; i++) n += s.shiny[i]; return n; }
  PG.SKINS = [
    { id: 'standard', kind: 'crate', name: 'Standard', need: 'Yours from the start', goal: 0 },
    { id: 'camo', kind: 'crate', name: 'Woodland Camo', need: 'Open 250 packs', goal: 250, have: function (s, all) { return all.packs; } },
    { id: 'arctic', kind: 'crate', name: 'Arctic Camo', need: 'Unlock the Industrial era', goal: 4, have: function (s) { return PG.erasUnlocked(s); } },
    { id: 'holo', kind: 'crate', name: 'Holo', need: 'Collect 10 shiny weapons', goal: 10, have: shinyTotal },
    { id: 'carbon', kind: 'crate', name: 'Carbon Fiber', need: 'Open 10,000 packs', goal: 10000, have: function (s, all) { return all.packs; } },
    { id: 'royal', kind: 'crate', name: 'Royal', need: 'Earn 25 Medals', goal: 25, have: function (s) { return s.medals; } },
    { id: 'gold', kind: 'crate', name: 'Solid Gold', need: 'Win the game', goal: 1, have: wins },
    { id: 'back-standard', kind: 'back', name: 'Standard', need: 'Yours from the start', goal: 0 },
    { id: 'back-camo', kind: 'back', name: 'Woodland Camo', need: 'Own 100 weapons', goal: 100, have: function (s) { return PG.ownedCount(s); } },
    { id: 'back-stars', kind: 'back', name: 'Stars', need: 'Pull 50 cards at 5★', goal: 50, have: function (s, all) { return all.fiveStars; } },
    { id: 'back-blueprint', kind: 'back', name: 'Blueprint', need: 'Open 5 golden packs', goal: 5, have: function (s, all) { return all.goldenPacks; } },
    { id: 'back-holo', kind: 'back', name: 'Holo', need: 'Collect 100 shiny weapons', goal: 100, have: shinyTotal },
    { id: 'back-carbon', kind: 'back', name: 'Carbon Fiber', need: 'Own all 420 weapons', goal: 420, have: function (s) { return PG.ownedCount(s); } },
    { id: 'back-gold', kind: 'back', name: 'Solid Gold', need: 'Prestige once', goal: 1, have: function (s) { return s.prestiges; } }
  ];
  PG.SKIN_BY_ID = {};
  PG.SKINS.forEach(function (k) { PG.SKIN_BY_ID[k.id] = k; });
  // How far along a skin's milestone you are: { have, goal }.
  PG.skinProgress = function (s, id, all) {
    const k = PG.SKIN_BY_ID[id];
    return { have: k.have ? Math.min(k.goal, k.have(s, all || PG.allTime(s))) : 0, goal: k.goal };
  };
  // Unlocks every skin whose milestone you've reached and returns the new ones.
  PG.checkSkins = function (s) {
    const all = PG.allTime(s), got = [];
    PG.SKINS.forEach(function (k) {
      if (s.skins.got[k.id] || PG.skinProgress(s, k.id, all).have < k.goal) return;
      s.skins.got[k.id] = 1;
      s.skins.fresh[k.id] = 1;
      got.push(k);

    return got;
  };
  PG.useSkin = function (s, id) {

  // ── Prestige ─────────────────────────────────────────────────────────
  // Prestige once you own every weapon (any star). Medals: 1 per 60 star cards, +10 for a win.
  PG.canPrestige = function (s) { return PG.ownedCount(s) === CARD_COUNT; };
  PG.medalsFor = function (s) {
    return Math.floor(PG.starCardCount(s) / PG.RULES.medalStarCards) + (PG.hasWon(s) ? PG.RULES.medalWinBonus : 0);
  };
  PG.prestige = function (s) {
    if (!PG.canPrestige(s)) return null;
    const gained = PG.medalsFor(s);
    const fresh = PG.newState();
    fresh.medals = s.medals + gained;
    fresh.prestiges = s.prestiges + 1;
    fresh.settings = Object.assign({}, s.settings, { autoOpen: false, autoPack: 'supply', qty: 1, autoQty: 1 });
    // Keep this run's numbers: add them to the all-time totals and remember a summary.
    fresh.life = PG.allTime(s);
    fresh.shiny = s.shiny.slice();   // the shiny collection is for good
    fresh.skins = JSON.parse(JSON.stringify(s.skins));   // and so are skins

      endedAt: Date.now(), playTime: s.stats.playTime, packs: s.stats.packs, cards: s.stats.cards, earned: s.stats.earned,

  // ── Clock ────────────────────────────────────────────────────────────
  // Advances timers by dt seconds. Returns events the UI may want to show.
  PG.tick = function (s, dt, rng) {

    let st = PG.stats(s);
    s.stats.playTime += dt;

    if (advanceFree(s, dt, st) > 0) events.push({ type: 'freeReady' });
    if (advanceMarket(s, dt, rng) > 0) events.push({ type: 'market', mega: s.market.mega ? s.market.mega.pack : null });
    easeDemand(s, dt);

    if (st.autoClaim && s.settings.autoClaim && s.free.stock > 0) {
      events.push({ type: 'autoFree', result: PG.openFree(s, rng) });
    }

    if (st.autoSell && s.settings.autoSell && s.dupeTotal > 0) {
      let coins = 0;
      if (st.sellRate === Infinity) coins = PG.sellAll(s);
      else {
        s.sellAcc += dt * st.sellRate;
        const n = Math.floor(s.sellAcc);
        if (n > 0) { s.sellAcc -= n; coins = sellHighest(s, n); }
      }
      if (coins) events.push({ type: 'autoSold', coins: coins });
    } else {
      s.sellAcc = 0;
    }

    if (st.autoOpen && s.settings.autoOpen) {
      s.autoTimer -= dt;
      if (s.autoTimer <= 0) {

        const room = pack ? PG.freeRoom(s, pack.id) : 0;
        const qty = Math.min(room, PG.affordable(s, s.settings.autoPack, Math.min(s.settings.autoQty, st.autoMax)));

          events.push({ type: 'autoWaiting', demand: true });

        } else {

  };

  // ── Save / load ──────────────────────────────────────────────────────
  PG.serialize = function (s) {
    return JSON.stringify(Object.assign({}, s, {
      owned: s.owned.join(''),
      stars: s.stars.map(function (m) { return m.toString(32); }).join(''),

  PG.deserialize = function (text) {
