    // place in its era (12 per star), so owned cards and duplicates keep those stars.
    const v1 = raw.v === 1;
    const oldStar = function (id) { return Math.floor((id % PER_ERA) / 12) + 1; };
    const s = PG.newState();
    if (typeof raw.coins === 'number' && isFinite(raw.coins)) s.coins = Math.max(0, raw.coins);
    // Version 3 saves list every star you have; older ones only kept your best star.
    if (typeof raw.stars === 'string' && raw.stars.length === CARD_COUNT) {
      for (let i = 0; i < CARD_COUNT; i++) s.stars[i] = (parseInt(raw.stars.charAt(i), 32) || 0) & ALL_STARS;
    } else if (typeof raw.owned === 'string') {
      for (let i = 0; i < CARD_COUNT; i++) {
        const c = +raw.owned.charAt(i) || 0;
        const best = v1 ? (c ? oldStar(i) : 0) : Math.max(0, Math.min(5, c));
        if (best) s.stars[i] = starBit(best);
      }
    }
    for (let i = 0; i < CARD_COUNT; i++) s.owned[i] = bestOf(s.stars[i]);
    if (typeof raw.shiny === 'string' && raw.shiny.length === CARD_COUNT) {
      for (let i = 0; i < CARD_COUNT; i++) s.shiny[i] = raw.shiny.charAt(i) === '1' ? 1 : 0;
    }
    if (raw.skins && typeof raw.skins === 'object') {
      ['got', 'fresh'].forEach(function (k) {
        const src = raw.skins[k];
        if (src && typeof src === 'object') Object.keys(src).forEach(function (id) { if (PG.SKIN_BY_ID[id]) s.skins[k][id] = 1; });
      });
      ['crate', 'back'].forEach(function (kind) {
        const id = raw.skins[kind];
        if (PG.SKIN_BY_ID[id] && PG.SKIN_BY_ID[id].kind === kind && s.skins.got[id]) s.skins[kind] = id;
      });
    }
    if (raw.dupes && typeof raw.dupes === 'object') {
      Object.keys(raw.dupes).forEach(function (k) {
        const n = raw.dupes[k] | 0;
        const key = v1 ? PG.dupeKey(+k, oldStar(+k)) : k;
        const p = PG.parseKey(key);
        if (p.id >= 0 && p.id < CARD_COUNT && p.star >= 1 && p.star <= 5 && n > 0) {
          s.dupes[PG.dupeKey(p.id, p.star)] = n; s.dupeTotal += n;
        }
      });
      // Older saves sent lower-star copies to Storage. The collection keeps every star now,
      // so the first copy of each star you were missing moves back into it.
      if (raw.v < 3) Object.keys(s.dupes).forEach(function (key) {
        const p = PG.parseKey(key);
        if (PG.hasStar(s, p.id, p.star)) return;
        s.stars[p.id] |= starBit(p.star);
        s.owned[p.id] = Math.max(s.owned[p.id], p.star);
        s.dupeTotal--;
        if (--s.dupes[key] <= 0) delete s.dupes[key];
      });
    }
    // Copies pulled per weapon and star. Saves from before this was counted start from what
    // you still have: one for each star in the collection plus any in Storage.
    const rawCopies = Array.isArray(raw.copies) && raw.copies.length === CARD_COUNT * 5 ? raw.copies : null;
    for (let i = 0; i < CARD_COUNT * 5; i++) {
      const id = Math.floor(i / 5), star = i % 5 + 1;
      const kept = (PG.hasStar(s, id, star) ? 1 : 0) + (s.dupes[PG.dupeKey(id, star)] || 0);
      const n = rawCopies ? Math.floor(+rawCopies[i]) : 0;
      s.copies[i] = Math.max(kept, n >= 0 && n < 1e12 ? n : 0);
    }
    if (raw.tech && typeof raw.tech === 'object') {
      Object.keys(raw.tech).forEach(function (k) {
        const node = PG.TECH_BY_ID[k];
        if (node) s.tech[k] = Math.max(0, Math.min(node.max, raw.tech[k] | 0));
      });
    }
    s.tech.hq = 1;
    // Conveyor Belt levels were a whole second each before version 4 and half a second now:
    // keep the same wait.
    if (raw.v < 4 && s.tech.aut_2) s.tech.aut_2 = Math.min(PG.TECH_BY_ID.aut_2.max, s.tech.aut_2 * 2);
    if (raw.market && raw.market.mult && typeof raw.market.mult === 'object') {
      const r = PG.RULES;
      PG.PACKS.forEach(function (p) {
        const m = +raw.market.mult[p.id], pv = raw.market.prev ? +raw.market.prev[p.id] : m;
        if (m >= r.marketLow && m <= r.marketHigh) s.market.mult[p.id] = m;
        if (pv >= r.marketLow && pv <= r.marketHigh) s.market.prev[p.id] = pv;
      });
      if (+raw.market.timer > 0) s.market.timer = Math.min(+raw.market.timer, r.marketPeriod);
      const mg = raw.market.mega;
      if (mg && PG.PACK_BY_ID[mg.pack] && PG.PACK_BY_ID[mg.pack].mythic5 && +mg.price > 0 && (mg.left | 0) > 0) {
        s.market.mega = { pack: mg.pack, price: +mg.price, left: Math.min(r.megaStock, mg.left | 0) };
      }
      s.market.ver = Math.max(0, raw.market.ver | 0);
      if (raw.market.recent && typeof raw.market.recent === 'object') PG.PACKS.forEach(function (p) {
        const list = raw.market.recent[p.id];
        if (!Array.isArray(list)) return;
        const ok = list.filter(function (b) {
          return Array.isArray(b) && +b[0] >= 0 && +b[0] < PG.RULES.demandWindow && +b[1] > 0 && +b[1] < 1e6;
        }).map(function (b) { return [+b[0], Math.floor(+b[1])]; });
        if (ok.length) s.market.recent[p.id] = ok.slice(0, 64);
      });
    }
    if (raw.free) {
      s.free.timer = +raw.free.timer > 0 ? +raw.free.timer : PG.RULES.freeTimer;
      s.free.stock = Math.max(0, raw.free.stock | 0);
    }
    ['medals', 'prestiges'].forEach(function (k) { if (raw[k] > 0) s[k] = raw[k] | 0; });
    if (PG.hasWon(s)) s.wonAt = +raw.wonAt > 0 ? +raw.wonAt : Date.now();
    if (raw.unseen && typeof raw.unseen === 'object') {
      Object.keys(raw.unseen).forEach(function (k) { if (s.owned[+k]) s.unseen[+k] = 1; });
    }
    if (raw.settings) Object.keys(s.settings).forEach(function (k) {
      if (typeof raw.settings[k] === typeof s.settings[k]) s.settings[k] = raw.settings[k];
    });
    if (!PG.PACK_BY_ID[s.settings.autoPack]) s.settings.autoPack = 'supply';
    s.settings.volume = Math.max(0, Math.min(1, +s.settings.volume || 0));
    if (raw.stats) Object.keys(s.stats).forEach(function (k) {
      if (typeof raw.stats[k] === 'number' && isFinite(raw.stats[k])) s.stats[k] = raw.stats[k];
    });
    if (v1) s.stats.bestTier = -1;   // old tiers meant something else
    const num = function (x) { return typeof x === 'number' && isFinite(x) && x >= 0; };
    if (raw.life && typeof raw.life === 'object') {
      Object.keys(s.life).forEach(function (k) { if (num(raw.life[k])) s.life[k] = raw.life[k]; });
      if (raw.life.bestTier === -1) s.life.bestTier = -1;
    } else {
      // Saves from before all-time stats only counted packs across runs. This run's new
      // weapons and duplicates can still be worked out from the collection.
      if (raw.stats && !num(raw.stats.newWeapons)) {
        s.stats.newWeapons = PG.ownedCount(s);
        s.stats.dupes = Math.max(0, s.stats.cards - s.stats.newWeapons - s.stats.upgrades);
      }
      const total = raw.stats && num(raw.stats.lifetimePacks) ? raw.stats.lifetimePacks : 0;
      s.life.packs = Math.max(0, total - s.stats.packs);
      s.life.startedAt = s.stats.startedAt;
    }
    if (Array.isArray(raw.runs)) {
      s.runs = raw.runs.filter(function (r) { return r && typeof r === 'object' && num(r.endedAt); }).slice(-100).map(function (r) {
        const out = {};
        ['endedAt', 'playTime', 'packs', 'cards', 'earned', 'starCards', 'fiveStarCards'].forEach(function (k) { out[k] = num(r[k]) ? r[k] : 0; });
        out.won = !!r.won;
        out.medals = num(r.medals) ? r.medals : 0;
        out.bestTier = typeof r.bestTier === 'number' && r.bestTier >= -1 && r.bestTier < 35 ? r.bestTier : -1;

      });

  };

</script>
<script>
/* Arsenal of Ages: weapon silhouettes.
 *
 * One small SVG drawing per weapon category, built from simple shapes on a
 * 100 x 100 grid. Solid parts use currentColor; class "h" marks highlight
 * parts, "s" a thick outline stroke and "t" a thin one (styled in CSS).
 */
(function (PG) {
  'use strict';

  function cls(c) { return c ? ' class="' + c + '"' : ''; }
  function R(x, y, w, h, rx, c) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (rx || 0) + '"' + cls(c) + '/>'; }
  function C(cx, cy, r, c) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + cls(c) + '/>'; }
  function E(cx, cy, rx, ry, c) { return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"' + cls(c) + '/>'; }
  function P(d, c) { return '<path d="' + d + '"' + cls(c) + '/>'; }
  function L(x1, y1, x2, y2, c) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + cls(c || 's') + '/>'; }
  function G(t, inner) { return '<g transform="' + t + '">' + inner + '</g>'; }
  function spikes(cx, cy, r1, r2, n, half) {
    let d = '';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const pt = function (rad, da) {
        return (cx + Math.cos(a + da) * rad).toFixed(1) + ' ' + (cy + Math.sin(a + da) * rad).toFixed(1);
      };
      d += 'M' + pt(r1, -half) + ' L' + pt(r2, 0) + ' L' + pt(r1, half) + 'Z ';
    }
    return P(d);
  }
  function wheel(cx, cy, r) { return C(cx, cy, r) + C(cx, cy, r * 0.45, 'h'); }

  const A = {
    rock: P('M20 66 Q14 48 30 38 Q40 24 58 28 Q76 28 82 44 Q90 62 74 72 Q56 82 36 78 Q22 76 20 66Z') +
      P('M33 45 Q43 34 56 36 Q46 41 39 50Z', 'h'),
    handaxe: P('M50 10 Q74 40 70 66 Q66 90 50 92 Q34 90 30 66 Q26 40 50 10Z') +

  // Draw a shape and its mirror image across y = 0.
  function mirror(k, pts, c, smooth) {
    const m = pts.map((p) => [p[0], -p[1]]);

  }
  // Top-view aircraft, nose toward +x. fus rows are [x, half-width] from tail to nose.
  function planeTop(k, o) {
    (o.wings || []).forEach((w) => mirror(k, w, o.wc, o.smoothWing));
    (o.tail || []).forEach((w) => mirror(k, w, '', o.smoothTail));
    (o.eng || []).forEach((e) => [1, -1].forEach((sg) => {
      k.rect(e[0], sg * e[1] - e[3], e[2], e[3] * 2, e[3] * 0.9);

    }));
    const top = o.fus.map((p) => [p[0], -p[1]]), bot = o.fus.map((p) => [p[0], p[1]]).reverse();
    k.curve(top.concat(bot.filter((p) => p[1] !== 0)));
    if (o.canopy) k.ell(o.canopy[0], 0, o.canopy[1], o.canopy[2], 'h');
    if (o.prop) k.line(o.prop[0], -o.prop[1], o.prop[0], o.prop[1], 'k h', 1.4);
  }

<script>
/* Arsenal of Ages: saving.
 *
 * Progress is written to this browser's localStorage and, as a second copy, to IndexedDB
 * (some apps clear one but not the other). When the game runs as a claude.ai artifact it
 * is also copied to the viewer's private cloud slot (db capability, data/users/<id>/save),
 * so it follows them between devices. Only people who may write the artifact's data get a
 * cloud slot (its owner, and editors or organization members it is shared with); players
 * who open a shared link keep their progress on their own device, so the game also offers
 * a backup code: the whole save as text they can keep and paste back in.
 */
(function (PG) {
  'use strict';

  const KEY = 'arsenal-of-ages-save-v1';
  const CLOUD_EVERY_MS = 20000;

  const Save = {
    cloud: null,          // DocumentReference once the cloud slot is ready
    cloudState: 'off',    // 'off' | 'connecting' | 'on'
    lastCloud: 0,
    cloudBusy: false,
    cloudDirty: false,
    localOK: true         // false when this browser refuses to store anything
  };

  // ── This device ──────────────────────────────────────────────────────
  try {
    window.localStorage.setItem(KEY + '-probe', '1');
    Save.localOK = window.localStorage.getItem(KEY + '-probe') === '1';
    window.localStorage.removeItem(KEY + '-probe');
  } catch (e) {
    Save.localOK = false;
  }
  // Ask the browser not to clear the game's storage when space runs low (best effort).
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { /* fine */ }); } catch (e) { /* not supported */ }

  Save.loadLocal = function () {
    try {
      const text = window.localStorage.getItem(KEY);
      return text ? PG.deserialize(text) : null;
    } catch (e) {
      return null;
    }
  };

  Save.saveLocal = function (state) {
    state.savedAt = Date.now();
    const text = PG.serialize(state);
    try { window.localStorage.setItem(KEY, text); } catch (e) { /* storage blocked: keep playing */ }
    idbPut(text);
    Save.cloudDirty = true;
  };

  Save.clearLocal = function () {
    try { window.localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    idbPut(null);
  };

  // The IndexedDB copy: one record, written at most one at a time (the newest wins).
  let idbConn = null, idbBusy = false, idbNext;
  function idbOpen() {
    if (idbConn) return idbConn;
    idbConn = new Promise(function (resolve) {
      try {
        const req = window.indexedDB.open('arsenal-of-ages', 1);
        req.onupgradeneeded = function () { req.result.createObjectStore('save'); };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = req.onblocked = function () { resolve(null); };
      } catch (e) {
        resolve(null);
      }
    });
    return idbConn;
  }
  function idbPut(text) {
    idbNext = text;
    if (idbBusy) return;
    idbBusy = true;
    idbOpen().then(function (db) {
      if (!db) return null;
      const write = function () {
        const value = idbNext;
        idbNext = undefined;
        return new Promise(function (resolve) {
          try {
            const tx = db.transaction('save', 'readwrite');
            if (value === null) tx.objectStore('save').delete(KEY); else tx.objectStore('save').put(value, KEY);
            tx.oncomplete = tx.onerror = tx.onabort = function () { resolve(); };
          } catch (e) { resolve(); }
        }).then(function () { if (idbNext !== undefined) return write(); });
      };
      return write();
    }).catch(function () { /* the localStorage copy still stands */ }).then(function () { idbBusy = false; });
  }
  // The IndexedDB copy, or null.
  Save.loadBackup = function () {
    return idbOpen().then(function (db) {
      if (!db) return null;
      return new Promise(function (resolve) {
        try {
          const req = db.transaction('save', 'readonly').objectStore('save').get(KEY);
          req.onsuccess = function () { resolve(typeof req.result === 'string' ? PG.deserialize(req.result) : null); };
          req.onerror = function () { resolve(null); };
        } catch (e) { resolve(null); }
      });
    }).catch(function () { return null; });
  };

  // ── Backup codes ─────────────────────────────────────────────────────
  // The whole save as text: "AOA1." + base64 of the compressed save (or "AOA0." + base64 of
  // the plain save where this browser cannot compress).
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function fromBase64(text) {
    const bin = atob(text);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function pipe(bytes, stream) {
    return new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer().then(function (b) { return new Uint8Array(b); });
  }
  Save.exportCode = function (state) {
    const bytes = new TextEncoder().encode(PG.serialize(state));
    if (typeof CompressionStream === 'function') {
      return pipe(bytes, new CompressionStream('deflate-raw'))
        .then(function (z) { return 'AOA1.' + toBase64(z); })
        .catch(function () { return 'AOA0.' + toBase64(bytes); });
    }
    return Promise.resolve('AOA0.' + toBase64(bytes));
  };
  // A save from a backup code, or null if the code isn't a valid one.
  Save.importCode = function (code) {
    const text = String(code || '').replace(/\s+/g, '');
    const m = /^AOA([01])\.([A-Za-z0-9+/=]+)$/.exec(text);
    if (!m) return Promise.resolve(null);
    let bytes;
    try { bytes = fromBase64(m[2]); } catch (e) { return Promise.resolve(null); }
    const plain = m[1] === '1'
      ? (typeof DecompressionStream === 'function' ? pipe(bytes, new DecompressionStream('deflate-raw')) : Promise.reject(new Error('no decompression')))
      : Promise.resolve(bytes);
    return plain.then(function (b) { return PG.deserialize(new TextDecoder().decode(b)); }).catch(function () { return null; });
  };

  // ── Claude account ───────────────────────────────────────────────────
  // Connects to the cloud slot. onRemote(state) is called if the cloud copy is newer.
  Save.initCloud = async function (getState, onRemote) {
    const claude = window.claude;
    if (!claude || typeof claude.use !== 'function') return;
    Save.cloudState = 'connecting';
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) { Save.cloudState = 'off'; return; }
      const id = await user.id();
      if (!id) { Save.cloudState = 'off'; return; }
      const ref = db.doc('data/users/' + id + '/save');
      const snap = await ref.get();
      if (snap.exists) {
        const body = snap.data();
        const remote = body && typeof body.data === 'string' ? PG.deserialize(body.data) : null;
        if (remote && remote.savedAt > (getState().savedAt || 0)) onRemote(remote);
      }
      // Only on once a write has gone through: players who may not write the artifact's
      // data (anyone who opened a shared link) are refused here.
      Save.cloud = ref;
      Save.cloudDirty = true;
      await Save.pushCloud(getState(), true);
      Save.cloudState = Save.cloud ? 'on' : 'off';
    } catch (e) {
      Save.cloud = null;
      Save.cloudState = 'off';
    }
  };

  // Writes to the cloud at most every 20 s (or right away when forced), one write at a time.
  Save.pushCloud = async function (state, force) {
    if (!Save.cloud || Save.cloudBusy || !Save.cloudDirty) return;
    const now = Date.now();
    if (!force && now - Save.lastCloud < CLOUD_EVERY_MS) return;
    Save.cloudBusy = true;
    Save.cloudDirty = false;
    Save.lastCloud = now;
    try {
      await Save.cloud.set({ savedAt: state.savedAt || now, data: PG.serialize(state) });
    } catch (e) {
      Save.cloudDirty = true;
      if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'invalid_argument' ||
        e.code === 'capability_disabled' || e.code === 'capability_removed')) {
        Save.cloud = null; Save.cloudState = 'off';
      }
    } finally {
      Save.cloudBusy = false;
    }
  };

  PG.Save = Save;
})(globalThis.PG = globalThis.PG || {});
</script>

// Sound effects, all made on the fly with the Web Audio API: no sound files to load.
(function (PG) {
  'use strict';

  let ctx = null, out = null, echo = null, noise = null;

  // Builds the mixer on an audio context: everything goes through a master volume and a
  // gentle limiter, and chimes can also send some of their sound to a soft echo.
  function build(c) {
    const master = c.createGain();
    const limit = c.createDynamicsCompressor();
    limit.threshold.value = -12;
    limit.ratio.value = 8;
    master.connect(limit);
    limit.connect(c.destination);

    delay.delayTime.value = 0.13;
    const feedback = c.createGain();
    feedback.gain.value = 0.32;
    const soften = c.createBiquadFilter();
    soften.type = 'lowpass';
    soften.frequency.value = 3500;
    delay.connect(soften);
    soften.connect(feedback);
    feedback.connect(delay);
    soften.connect(master);

    const buf = c.createBuffer(1, Math.floor(c.sampleRate * 1.5), c.sampleRate);
    const d = buf.getChannelData(0);

  // (and any tap after the phone was locked) wakes it up.

  }

  function rarityLabel(tier) {
    const era = Math.floor(tier / 5), star = tier % 5 + 1;
    return '<span class="rar" style="--rc:' + PG.ERAS[era].color + '">' + PG.ERAS[era].rarity + ' ' + star + '★</span>';
  }

  // o.star = the stars this copy has (0 when you don't own the weapon yet).
  // o.mask = which stars of it you have (collection cards light up each one you own).
  function cardHTML(id, o) {
    o = o || {};
    const c = PG.CARDS[id], era = PG.ERAS[c.era];
    const owned = o.owned !== false;
    const star = owned ? (o.star || 0) : 0;
    const cls = ['card', 'e' + c.era, 's' + star];
    if (!owned) cls.push('missing');
    if (o.lockedEra) cls.push('locked-era');
    if (o.shiny && owned) cls.push('shiny');
    if (o.golden) cls.push('golden');
    const tag = o.static ? 'div' : 'button';
    return '<' + tag + ' class="' + cls.join(' ') + '" style="--rc:' + era.color + '"' +
      (o.static ? '' : ' type="button" data-act="card" data-id="' + id + '"') +
      ' aria-label="#' + c.rank + ' ' + (owned ? esc(c.name) + ', ' + era.rarity + ' ' + star + ' stars' : 'not collected, ' + era.rarity) + '">' +
      '<span class="c-top"><span class="c-rank">#' + c.rank + '</span>' + (o.mask !== undefined ? starMaskHTML(owned ? o.mask : 0) : starsHTML(star)) + '</span>' +
      '<span class="c-art">' + PG.cardArt(id) +
      (star ? '<span class="c-worth num" title="Sells for">' + COIN + fmt(PG.sellValue(S, id, star)) + '</span>' : '') + (o.art || '') +
      (o.shiny && owned ? '<span class="c-shiny" title="Shiny">✦</span>' : '') + '</span>' +
      '<span class="c-name">' + (owned ? esc(c.name) : '???') + '</span>' +
      '<span class="c-meta"><span>' + esc(owned ? PG.formatYearShort(c.year) : era.name) + '</span><span>' + era.rarity + '</span></span>' +
      (o.badge || '') + (o.count ? '<span class="count">×' + o.count + '</span>' : '') +
      '</' + tag + '>';
  }

  function chipHTML(f) {
    const c = PG.CARDS[f.id];
    return '<span class="chip" style="--rc:' + PG.ERAS[c.era].color + '"><span class="mini">' + PG.cardArt(f.id) + '</span>' +
      esc(c.name) + ' ' + f.star + '★</span>';

  function pullTier(r) { return PG.tierOf(PG.CARDS[r.id].era, r.star); }

  // ── App state ────────────────────────────────────────────────────────
  let S = null;
  const ui = {
    tab: 'shop', era: 0, mounted: null, key: '', overlay: null, sheetOpen: false,
    feed: [], autoNote: '', lastCoins: -1, viewDirty: true, collSig: '', storeRows: new Map(), resetArmed: 0,
    saveReady: false, startedAt: Date.now(), backupTip: false

  const view = $('#view');

  // ── Toasts ───────────────────────────────────────────────────────────
  function toast(msg, kind, ms) {
    ms = ms || 3000;
    const box = $('#toasts');
    while (box.children.length > 2) box.firstChild.remove();
    const t = document.createElement('div');
    t.className = 'toast' + (kind ? ' ' + kind : '');
    t.textContent = msg;
    if (ms !== 3000) t.style.animationDelay = '0s, ' + (ms - 400) / 1000 + 's';
    box.appendChild(t);
    setTimeout(function () { t.remove(); }, ms);
  }

  // Inside an app on a phone (the Claude app shows games in a frame) the frame can be taller
  // than the space left under the app's header, so its bottom (and a tab bar pinned there)
  // runs off the screen. The page can't see the app's header, but it can see its own height
  // and the screen's: if the page plus a typical status bar and header (about 90px on phones
  // with a notch, 60px on older ones) is taller than the screen, about that much is hidden,
  // and the tab bar gets that much room under its tabs. The app resizes the frame as you
  // scroll, which fires 'resize', so the room follows it and is 0 whenever nothing is hidden.
  function inApp() {
    let framed = true;
    try { framed = window.self !== window.top; } catch (e) { /* cross-origin parent: framed */ }
    return framed && !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  }
  function updateDockRoom() {
    let room = 0;
    if (inApp() && window.screen) {
      const tall = window.innerHeight >= window.innerWidth;
      const screenH = tall ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      const top = tall ? (screenH >= 800 ? 90 : 60) : 40;
      const hidden = Math.round(window.innerHeight + top - screenH);
      if (hidden > 4) room = Math.min(hidden + 4, 140);
    }
    if (room !== ui.dockRoom) {
      ui.dockRoom = room;
      document.documentElement.style.setProperty('--dock-room', room + 'px');
    }
  }
  function useDock() {
    updateDockRoom();
    window.addEventListener('resize', updateDockRoom);
    window.addEventListener('orientationchange', updateDockRoom);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', updateDockRoom);
  }

  // ── Resource bar and tabs ────────────────────────────────────────────
  function mountChrome() {

  function setBadge(tab, text, red, dot) {

  // ── Shop ─────────────────────────────────────────────────────────────
  function shopKey(st) {
    return ['shop', st.eras, st.bulkMax, st.autoOpen, st.autoClaim, st.freePack, S.settings.qty, Math.round(st.valueMult * 100), st.discount,
      JSON.stringify(st.extraCards),
      st.luck, S.settings.autoOpen, S.settings.autoPack, S.settings.autoQty, S.settings.autoClaim, S.settings.tipDone, S.market.ver,
      S.market.mega ? S.market.mega.pack + S.market.mega.left : '', S.skins.crate].join('|');
  }

  // A pack's card range, like "3–7½ cards" (½: a 50% chance of room for one more).
  function cardsText(r) { return r[0] + '–' + Math.floor(r[1]) + (r[1] % 1 ? '½' : '') + ' cards'; }
  function cardRange(pack) { return cardsText(PG.packCards(S, pack)); }

  // Extra perks a bought pack has: a guaranteed card and no 1★ cards.
  function packPerks(pack, st) {
    const bits = [];
    const g = PG.guaranteeEra(S, pack, st);
    if (g >= 0) bits.push('1 card always ' + PG.ERAS[g].rarity + ' or better');
    if (pack.noOneStar) bits.push('no 1★ cards');
    return bits.join(' · ');
  }

  // Green tag = cheaper than normal right now, red = pricier. "In demand" means you bought
  // more than the free amount recently and the price is still settling back.
  function marketTag(pack) {
    const mega = PG.megaSale(S, pack.id);
    if (mega) return '<span class="mkt mega">MEGA SALE · ' + mega.left + ' left</span>';
    const pct = Math.round((PG.marketMult(S, pack.id) * PG.demandMult(S, pack.id) - 1) * 100);
    const busy = PG.demandMult(S, pack.id) > 1 ? ' · in demand' : '';
    if (pct <= -2) return '<span class="mkt down">▼ ' + (-pct) + '% off' + busy + '</span>';
    if (pct >= 2) return '<span class="mkt up">▲ ' + pct + '% more' + busy + '</span>';
    return '<span class="mkt flat">Normal price</span>';
  }

  // How close you are to the free amount per few minutes, once it starts to matter.
  function recentNote(pack) {
    const n = PG.recentBought(S, pack.id), free = PG.RULES.demandFree, mins = Math.round(PG.RULES.demandWindow / 60);
    if (PG.megaSale(S, pack.id) || n < free / 2) return '';
    if (n < free) return fmt(n) + ' / ' + fmt(free) + ' bought in the last ' + mins + ' min · the price goes up after ' + fmt(free);
    return fmt(n) + ' bought in the last ' + mins + ' min, so the price is up. It starts coming down in ' + clock(PG.demandEasesIn(S, pack.id)) + '.';
  }

  function buyLabel(price, qty) { return 'Open' + (qty > 1 ? ' ×' + qty : '') + ' · ' + COIN + ' ' + fmt(price * qty); }

  function bulkOptions(st) { return PG.BULK.filter(function (n) { return n <= st.bulkMax; }); }

  function packRow(pack, st) {
    const unlocked = PG.packUnlocked(S, pack);
    const label = pack.eraOnly !== undefined ? PG.ERAS[pack.eraOnly].name + ' weapons only' : 'from every era you have unlocked';
    if (!unlocked) {
      return '<div class="pack locked"><div class="crate">' + crateSVG(pack) + '</div><div class="info"><h3>' + esc(pack.name) +
        '</h3><div class="meta">' + cardRange(pack) + ' · ' + label + '</div><div class="actions">' + ICON.lock.replace('<svg', '<svg width="16" height="16"') +
        ' Unlock the ' + PG.ERAS[pack.needEra].name + ' era in the Tech tree</div></div></div>';
    }
    const odds = PG.packOdds(S, pack, st);
    const top = odds[odds.length - 1];
    const ev = PG.packWorth(S, pack, st);
    const perks = packPerks(pack, st);
    const mega = PG.megaSale(S, pack.id);
    const qty = Math.min(S.settings.qty, st.bulkMax, mega ? mega.left : Infinity);
    const price = PG.packPrice(S, pack);
    const megaNote = mega ? '<div class="mega-note">Sale price: these cards sell for about <b>' + Math.round(ev / price * 100) +
      '%</b> of what you pay on average. Only <b>' + mega.left + '</b> left at this price.</div>' : '';
    return '<div class="pack' + (mega ? ' on-mega' : '') + '" data-pack="' + pack.id + '" id="pack-' + pack.id + '"><div class="crate">' + crateSVG(pack) + '</div><div class="info">' +
      '<div class="pack-head"><h3>' + esc(pack.name) + '</h3>' + marketTag(pack) + '</div>' +
      '<div class="meta"><b>' + cardRange(pack) + '</b> · ' + label + (perks ? '<br><span class="perks">' + perks + '</span>' : '') +
      '<br>Cards worth ≈ <b>' + fmt(ev) + '</b> on average · rarest: ' + rarityLabel(top.tier) + ' ' + chance(top.p) + ' per card</div>' + megaNote +
      '<div class="recent" data-recent="' + pack.id + '">' + recentNote(pack) + '</div>' +
      '<div class="actions"><button class="btn primary num" type="button" data-act="buy" data-pack="' + pack.id + '" data-qty="' + qty + '" data-cost="' + price * qty + '">' +
      buyLabel(price, qty) + '</button>' +
      '<button class="btn" type="button" data-act="odds" data-pack="' + pack.id + '">Odds</button></div></div></div>';
  }

  function mountShop() {
    const st = PG.stats(S);
    const freePack = PG.PACK_BY_ID[st.freePack];
    if (S.settings.qty > st.bulkMax) S.settings.qty = st.bulkMax;
    const qtys = bulkOptions(st);
    let html = '<div class="view-title"><h1>Armory Shop</h1></div>' +
      '<p class="view-sub">Collect all 420 weapons, ranked from the oldest (#1) to the newest (#420). Newer weapons are rarer.</p>' +
      '<button class="free" id="free-btn" type="button" data-act="free"><span class="crate-wrap">' + crateSVG(freePack) +
      '<svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="#15191d" stroke="#333c45" stroke-width="4"/>' +
      '<circle id="free-ring" cx="20" cy="20" r="16" fill="none" stroke="#f3c96e" stroke-width="4" stroke-dasharray="100.5" stroke-dashoffset="0" transform="rotate(-90 20 20)" stroke-linecap="round"/></svg></span>' +
      '<span class="free-txt"><span class="free-title">Free ' + esc(freePack.name) + '</span><span class="free-sub">' + PG.RULES.freeCards[0] + '–' + PG.RULES.freeCards[1] +
      ' cards</span><span class="timer num" id="free-timer"></span><span class="hint" id="free-hint"></span></span></button>';
    if (!S.settings.tipDone) {
      html += '<div class="tip">' + ICON.info.replace('<svg', '<svg width="20" height="20" style="flex:none"') +
        '<span>Tap the crate to make its timer go faster. Duplicate cards go to <b>Storage</b>: sell them for coins, then spend coins on packs and <b>Tech</b> upgrades.</span>' +
        '<button class="btn" type="button" data-act="tip-done">Got it</button></div>';
    }
    html += '<div class="qty-row"><span class="lbl">Open at once</span><div class="seg" role="group" aria-label="Packs to open at once">' +
      qtys.map(function (n) { return '<button type="button" data-act="qty" data-n="' + n + '" aria-pressed="' + (n === S.settings.qty) + '">×' + n + '</button>'; }).join('') +
      '</div>' + (st.bulkMax < PG.BULK[PG.BULK.length - 1] ? '<span class="muted">More with Tech: ' + (PG.level(S, 'blk_1') < 3 ? 'Bigger Bags' : 'Supply Truck') + '</span>' : '') + '</div>';

    if (st.autoOpen) {
      const options = PG.PACKS.filter(function (p) { return PG.packUnlocked(S, p); }).map(function (p) {
        return '<option value="' + p.id + '"' + (p.id === S.settings.autoPack ? ' selected' : '') + '>' + esc(p.name) + '</option>';
      }).join('');
      // The Auto-Opener has its own steps (Auto Loader, then Assembly Line). A saved amount
      // it can't do yet drops to the biggest step you have.
      const autoQtys = PG.AUTO_STEPS.filter(function (n) { return n <= st.autoMax; });
      if (autoQtys.indexOf(S.settings.autoQty) < 0) S.settings.autoQty = autoQtys.filter(function (n) { return n <= S.settings.autoQty; }).pop() || 1;
      const qOpts = autoQtys.map(function (n) { return '<option value="' + n + '"' + (n === S.settings.autoQty ? ' selected' : '') + '>×' + n + ' at a time</option>'; }).join('');
      html += '<div class="auto-panel"><div class="row"><label class="switch"><input type="checkbox" id="auto-on" data-change="auto-on"' +
        (S.settings.autoOpen ? ' checked' : '') + '> Auto-Opener</label>' +
        '<select id="auto-pack" data-change="auto-pack" aria-label="Pack to auto-open">' + options + '</select>' +
        '<select id="auto-qty" data-change="auto-qty" aria-label="How many at a time">' + qOpts + '</select></div>' +
        (st.autoClaim ? '<div class="row" style="margin-top:8px"><label class="switch"><input type="checkbox" data-change="auto-claim"' +
          (S.settings.autoClaim ? ' checked' : '') + '> Auto-claim free packs</label></div>' : '') +
        '<div class="status" id="auto-status"></div><div class="auto-feed" id="auto-feed"></div></div>';
    }

    const mega = S.market.mega && PG.PACK_BY_ID[S.market.mega.pack];
    if (mega) {
      const off = Math.round((1 - S.market.mega.price / PG.basePrice(S, mega)) * 100);
      html += '<div class="mega-bar"><span><b>MEGA SALE!</b> ' + esc(mega.name) + ' is <b>' + off + '% off</b>. Only <b>' + S.market.mega.left +
        '</b> at this price, ends in <b class="num" id="mega-timer"></b>.</span><button class="btn primary" type="button" data-act="goto-mega">Show</button></div>';
    }
    html += '<div class="market-bar">' + ICON.market.replace('<svg', '<svg width="20" height="20" style="flex:none"') +
      '<span>Market prices change in <b class="num" id="market-timer"></b>. <span class="mkt down">Green</span> tags are cheaper than normal, <span class="mkt up">red</span> ones pricier. Buy more than ' + fmt(PG.RULES.demandFree) + ' of one pack within ' + Math.round(PG.RULES.demandWindow / 60) + ' minutes and its price starts to climb.</span></div>' +
      '<div class="section-label">Mixed packs</div><div class="packs">' +
      PG.TIER_PACKS.map(function (p) { return packRow(p, st); }).join('') + '</div>' +
      '<div class="section-label">Era packs</div><div class="packs">' +
      PG.ERA_PACKS.map(function (p) { return packRow(p, st); }).join('') + '</div>';
    view.innerHTML = html;
    renderFeed();
  }

  function updateShop() {
    const st = PG.stats(S);
    const btn = $('#free-btn');
    if (!btn) return;
    const ready = S.free.stock > 0;
    btn.classList.toggle('ready', ready);
    const timer = $('#free-timer'), hint = $('#free-hint');
    const full = S.free.stock >= st.freeStockMax;
    if (ready) {
      timer.textContent = S.free.stock > 1 ? 'OPEN ×' + S.free.stock : 'OPEN IT!';
      hint.textContent = full ? (st.freeStockMax > 1 ? 'Tap to open them. Your depot is full.' : 'Tap to open it.') : 'Tap to open · next one in ' + clock(S.free.timer);
    } else {
      timer.textContent = clock(S.free.timer);
      hint.textContent = 'Tap to speed up: −' + st.tapPower + ' s per tap';
    }
    const frac = full ? 1 : 1 - S.free.timer / st.freeTime;
    $('#free-ring').setAttribute('stroke-dashoffset', String(100.5 * (1 - Math.max(0, Math.min(1, frac)))));
    $$('[data-act="buy"]', view).forEach(function (b) {
      // Prices drift back down after you buy, so keep the button and tag current.
      const pack = PG.PACK_BY_ID[b.dataset.pack], qty = +b.dataset.qty || 1, cost = PG.packPrice(S, pack) * qty;
      if (cost !== +b.dataset.cost) {
        b.dataset.cost = cost;
        b.innerHTML = buyLabel(cost / qty, qty);
        const tag = $('#pack-' + pack.id + ' .mkt');
        if (tag) tag.outerHTML = marketTag(pack);
      }
      b.disabled = S.coins < cost;
    });
    $$('[data-recent]', view).forEach(function (el) {
      const text = recentNote(PG.PACK_BY_ID[el.dataset.recent]);
      if (el.textContent !== text) el.textContent = text;

    const mt = $('#market-timer');
    if (mt) mt.textContent = clock(S.market.timer);
    const mgt = $('#mega-timer');
    if (mgt) mgt.textContent = clock(S.market.timer);
    const status = $('#auto-status');
    if (status) {
      const pack = PG.PACK_BY_ID[S.settings.autoPack];
      const qty = Math.min(S.settings.autoQty, st.autoMax);
      if (!S.settings.autoOpen) status.textContent = 'Off. Switch it on to open packs automatically while you have the coins.';
      else if (ui.autoNote === 'demand') status.textContent = 'Paused: you\'ve bought ' + fmt(PG.recentBought(S, pack.id)) + ' × ' + pack.name + ' in the last ' +

      else if (ui.autoNote === 'waiting') status.textContent = 'Waiting for coins (' + fmt(PG.packPrice(S, pack) * qty) + ' needed)…';
      else status.textContent = 'Opening ' + qty + '× ' + pack.name + ' every ' + PG.autoInterval(S, qty * pack.cards).toFixed(1) + ' s. New finds show up below.';
    }
  }
