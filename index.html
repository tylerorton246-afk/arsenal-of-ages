      shinyCount() + '</b> / 420</span></div>' +
      '<p class="view-sub" style="margin-top:10px">Every weapon is ranked from oldest (#1) to newest (#420) and its era sets the rarity. Each weapon comes in 1★ to 5★, and every star is its own card: the lit stars on a card are the ones you have.</p>' +
      '<div class="era-strip" role="tablist" aria-label="Eras">' + PG.ERAS.map(function (e, i) {
        const hasNew = Object.keys(S.unseen).some(function (k) { return PG.CARDS[+k].era === i; });
        return '<button class="era-chip' + (hasNew ? ' has-new' : '') + '" type="button" role="tab" data-act="era" data-era="' + i + '" aria-pressed="' + (i === ui.era) +
          '" style="--rc:' + e.color + '"><span class="n">' + esc(e.name) + '</span><span class="r">' + e.rarity + '</span><span class="c num">' +
          (i < st.eras ? PG.ownedInEra(S, i) + ' / 60' : 'Locked') + '</span></button>';
      }).join('') + '</div>';
    let rows = '';
    for (let s = 1; s <= 5; s++) rows += '<span>' + s + '★: ' + PG.countByStar(S, s, ui.era) + ' / 60</span>';
    html += '<div class="era-head" style="--rc:' + era.color + '"><h2>' + esc(era.name) + ' <span class="rar" style="font-size:18px">' + era.rarity + '</span></h2>' +
      '<div class="line"><span>' + esc(era.span) + '</span><span>Ranks #' + (ui.era * 60 + 1) + '–#' + (ui.era * 60 + 60) + '</span><span class="num">' + have + ' / 60 collected</span></div>' +
      '<div class="star-rows">' + rows + '</div></div>';
    if (!unlocked) {
      html += '<div class="lock-note">This era is locked. Research it in the Tech tree once you own ' + PG.RULES.eraUnlockNeed + ' ' +
        esc(PG.ERAS[ui.era - 1].name) + ' cards.</div>';
    }
    html += '<div class="grid">';
    for (let i = ui.era * 60; i < ui.era * 60 + 60; i++) {
      html += cardHTML(i, {
        owned: !!S.owned[i], star: S.owned[i], mask: S.stars[i], lockedEra: !unlocked, shiny: !!S.shiny[i],
        badge: S.unseen[i] ? '<span class="badge">NEW</span>' : ''
      });
    }
    view.innerHTML = html + '</div>';
    const chip = $('.era-chip[aria-pressed="true"]', view);
    if (chip) chip.parentElement.scrollLeft = chip.offsetLeft - chip.parentElement.offsetLeft - 16;
    // These cards have now been seen; their NEW badges stay until the next visit.
    let changed = false;
    Object.keys(S.unseen).forEach(function (k) { if (PG.CARDS[+k].era === ui.era) { delete S.unseen[k]; changed = true; } });
    if (changed) updateChrome();
    ui.collSig = collectionSig();
  }

  function collectionSig() { return ui.era + ':' + PG.starCardCount(S) + ':' + PG.erasUnlocked(S) + ':' + S.wonAt + ':' + shinyCount(); }
  function shinyCount() { let n = 0; for (let i = 0; i < S.shiny.length; i++) n += S.shiny[i]; return n; }

  // ── Stats ────────────────────────────────────────────────────────────
  // This run (since the last prestige) next to all time (every run added up), then a line
  // for each finished run.
  function mountStats() {
    const run = S.stats, all = PG.allTime(S);
    const best = function (t) { return t >= 0 ? rarityLabel(t) : '—'; };
    const row = function (label, a, b, sub) {
      return '<div class="st-row' + (sub ? ' sub' : '') + '"><span class="st-l">' + label + '</span><span class="st-v num">' + a +
        '</span><span class="st-v num">' + b + '</span></div>';
    };
    const nums = function (label, key, sub) { return row(label, fmt(run[key]), fmt(all[key]), sub); };
    const section = function (title) { return '<div class="st-sec">' + title + '</div>'; };
    const wins = S.runs.filter(function (r) { return r.won; }).length + (S.wonAt ? 1 : 0);
    const missing = S.prestiges - S.runs.length;

    let html = '<div class="view-title"><h1>Stats</h1></div>' +
      '<p class="view-sub">This run counts from your last prestige' + (S.prestiges ? '' : ' (you haven\'t prestiged yet, so both columns match)') +
      '. All time adds up every run since ' + esc(dateText(all.startedAt)) + '.</p>' +
      '<div class="st-tiles">' +
      '<div class="st-tile"><b class="num">' + S.prestiges + '</b><span>Prestiges</span></div>' +
      '<div class="st-tile"><b class="num">' + fmt(S.medals) + '</b><span>Medals</span></div>' +
      '<div class="st-tile"><b class="num">' + wins + '</b><span>' + (wins === 1 ? 'Win' : 'Wins') + '</span></div>' +
      '<div class="st-tile"><b class="num">' + duration(all.playTime) + '</b><span>Played</span></div></div>' +
      '<div class="st-table">' +
      '<div class="st-row st-head"><span class="st-l"></span><span class="st-v">This run</span><span class="st-v">All time</span></div>' +
      section('Collection') +
      row('Weapons', fmt(PG.ownedCount(S)) + ' / 420', '—') +
      row('Star cards', fmt(PG.starCardCount(S)) + ' / 2,100', '—') +
      row('5★ cards', fmt(PG.countByStar(S, 5)) + ' / 420', '—') +
      section('Packs') +
      nums('Packs opened', 'packs') +
      row('Bought', fmt(run.packs - run.freePacks), fmt(all.packs - all.freePacks), true) +
      nums('Free', 'freePacks', true) +
      nums('By the Auto-Opener', 'autoPacks', true) +
      nums('At a Mega Sale', 'megaPacks', true) +
      section('Cards') +
      nums('Cards pulled', 'cards') +
      nums('New weapons', 'newWeapons', true) +
      nums('New stars', 'upgrades', true) +
      nums('Duplicates', 'dupes', true) +
      nums('Scrapped (storage full)', 'scrapped', true) +
      nums('5★ pulls', 'fiveStars') +
      nums('Mythic pulls', 'mythics') +
      nums('Shiny pulls', 'shinies') +
      row('Shiny collection', '—', shinyCount() + ' / 420') +
      nums('Golden packs', 'goldenPacks') +
      row('Rarest pull', best(run.bestTier), best(all.bestTier)) +
      section('Coins') +
      nums('Coins earned', 'earned') +
      nums('From new cards', 'rewardCoins', true) +
      nums('From selling', 'sellCoins', true) +
      nums('Bought-pack bonus', 'bonusCoins', true) +
      nums('From shiny cards', 'shinyCoins', true) +
      nums('Cards sold', 'soldCards') +
      nums('Coins spent', 'spent') +
      nums('On packs', 'packSpent', true) +
      nums('On tech', 'techSpent', true) +
      nums('Tech upgrades bought', 'techBought') +
      section('Other') +
      row('Time played', duration(run.playTime), duration(all.playTime)) +
      nums('Free-pack taps', 'taps') +
      '</div>';

    html += '<div class="section-label">Past runs</div>';
    if (!S.runs.length && !missing) html += '<p class="muted">Each time you prestige, that run shows up here.</p>';
    html += '<div class="runs">' + S.runs.map(function (r, i) {
      return { r: r, n: i + 1 + Math.max(0, missing) };
    }).reverse().map(function (o) {
      const r = o.r;
      return '<div class="run"><div class="run-top"><b>Run ' + o.n + '</b>' + (r.won ? '<span class="run-won">🏆 Won</span>' : '') +
        '<span class="muted">' + esc(dateText(r.endedAt)) + '</span></div>' +
        '<div class="run-line num">' + duration(r.playTime) + ' played · ' + fmt(r.packs) + ' packs · ' + fmt(r.cards) + ' cards · ' + fmt(r.earned) + ' coins earned</div>' +
        '<div class="run-line num">' + fmt(r.starCards) + ' / 2,100 star cards · ' + fmt(r.fiveStarCards) + ' 5★ · rarest ' + best(r.bestTier) +
        ' · <b class="gold">+' + fmt(r.medals) + ' medals</b></div></div>';
    }).join('') + '</div>';
    if (missing > 0) {
      html += '<p class="muted">' + (missing === 1 ? 'Your first run' : 'Your first ' + missing + ' runs') +
        ' ended before this page existed, so all-time numbers only include ' + (missing === 1 ? 'its' : 'their') + ' packs opened.</p>';
    }
    view.innerHTML = html;
  }

  function statsSig() { return Math.floor(S.stats.playTime) + ':' + S.stats.cards + ':' + S.stats.earned + ':' + S.stats.spent + ':' + S.prestiges; }

  // ── Storage ──────────────────────────────────────────────────────────
  function mountStorage() {
    view.innerHTML = '<div class="view-title"><h1>Storage</h1></div>' +
      '<p class="view-sub">Duplicate cards wait here. Sell them for coins. When storage is full, new duplicates get scrapped for nothing.</p>' +
      '<div class="store-head" id="store-head"></div><div class="dupe-list" id="dupe-list"></div><div class="empty" id="dupe-empty" hidden>No duplicates right now. Open packs and any repeats will land here.</div>';
    ui.storeRows = new Map();
    ui.storeSig = '';
    updateStorage(true);
  }

  function updateStorage(force) {
    const head = $('#store-head');
    if (!head) return;
    const st = PG.stats(S);
    const sig = [S.dupeTotal, Object.keys(S.dupes).length, st.valueMult, st.sellMode, st.storageCap, st.autoSell, S.settings.autoSell, st.sellRate].join('|');
    if (!force && sig === ui.storeSig) return;
    ui.storeSig = sig;
    let worth = 0;
    Object.keys(S.dupes).forEach(function (k) { const p = PG.parseKey(k); worth += S.dupes[k] * PG.sellValue(S, p.id, p.star, st); });
    const full = S.dupeTotal >= st.storageCap;
    head.className = 'store-head' + (full ? ' full' : '');
    const rateText = st.sellRate === Infinity ? 'instantly' : st.sellRate + ' per second';
    head.innerHTML = '<div class="top"><span class="cap num">' + fmt(S.dupeTotal) + ' / ' + fmt(st.storageCap) + '</span><span>Worth <b class="num">' + fmt(worth) + '</b> coins</span></div>' +
      '<div class="progress"><i style="width:' + Math.min(100, S.dupeTotal / st.storageCap * 100) + '%"></i></div>' +
      (full ? '<div class="warn">Storage is full. New duplicates are being scrapped. Sell some, or buy Bigger Locker in Tech.</div>' : '') +
      '<div class="row">' +
      (st.sellMode >= 2 ? '<button class="btn primary" type="button" data-act="sell-all"' + (S.dupeTotal ? '' : ' disabled') + '>Sell all · ' + COIN + ' ' + fmt(worth) + '</button>'
        : '<span class="muted">Tap a card’s Sell button. Bulk Selling in Tech sells faster.</span>') +
      (st.autoSell ? '<label class="switch"><input type="checkbox" data-change="auto-sell"' + (S.settings.autoSell ? ' checked' : '') + '> Auto-sell (' + rateText + ')</label>' : '') +
      '</div>';

    // One row per weapon + stars ("123:4"), most valuable first.
    const ids = Object.keys(S.dupes).sort(function (a, b) { return PG.keyValue(b) - PG.keyValue(a) || (a < b ? -1 : 1); });
    const list = $('#dupe-list');
    const seen = new Set();
    // Very large stores only list the 150 most valuable kinds to keep the page quick.
    ids.slice(0, 150).forEach(function (key) {
      seen.add(key);
      let row = ui.storeRows.get(key);
      const k = PG.parseKey(key);
      const c = PG.CARDS[k.id];
      const n = S.dupes[key];
      const each = PG.sellValue(S, k.id, k.star, st);
      if (!row) {
        row = document.createElement('div');
        row.className = 'dupe';
        row.style.setProperty('--rc', PG.ERAS[c.era].color);
        row.innerHTML = '<span class="mini">' + PG.cardArt(k.id) + '</span><span style="min-width:0"><span class="nm">' + esc(c.name) +
          '</span><br><span class="sub"></span></span><button class="btn num" type="button" data-act="sell" data-key="' + key + '"></button>';
        ui.storeRows.set(key, row);
      }
      row.querySelector('.sub').innerHTML = starsHTML(k.star) + ' ' + PG.ERAS[c.era].rarity + ' · <b>×' + n + '</b> · ' + fmt(each) + ' each';
      const sellN = st.sellMode >= 1 ? n : 1;
      row.querySelector('.btn').innerHTML = 'Sell' + (sellN > 1 ? ' ×' + sellN : '') + ' · ' + COIN + ' ' + fmt(each * sellN);
    });
    ui.storeRows.forEach(function (row, id) { if (!seen.has(id)) { row.remove(); ui.storeRows.delete(id); } });
    // Put rows in order only when the order is wrong, so a button never jumps while pressed.
    const order = ids.slice(0, 150).map(function (id) { return ui.storeRows.get(id); });
    const current = Array.prototype.slice.call(list.children);
    if (order.length !== current.length || order.some(function (r, i) { return r !== current[i]; })) {
      order.forEach(function (r) { list.appendChild(r); });
    }
    $('#dupe-empty').hidden = ids.length > 0;
  }

  // ── Tech tree ────────────────────────────────────────────────────────
  const COLW = 104, ROWH = 118, NODE_W = 88, NODE_H = 92, TOP = 8;
  const BRANCHES = ['Supply', 'Speed', 'Bulk', '', 'Value', 'Luck', 'Storage', 'Auto', 'Packs'];

  function nodeXY(n) { return { x: n.col * COLW + (COLW - NODE_W) / 2, y: TOP + n.row * ROWH }; }

  function nodeIcon(n) {
    if (n.kind === 'era') return PG.artSVG(ERA_ICON[n.era]);
    if (n.kind === 'root') return PG.artSVG('hq');
    return ICON[n.icon] || ICON.gear;
  }

  function mountTech() {
    const rows = Math.max.apply(null, PG.TECH.map(function (n) { return n.row; })) + 1;
    const cols = Math.max.apply(null, PG.TECH.map(function (n) { return n.col; })) + 1;
    const w = cols * COLW, h = TOP + rows * ROWH;
    let links = '';
    PG.TECH.forEach(function (n) {
      n.req.forEach(function (r) {
        const p = PG.TECH_BY_ID[r];
        const a = nodeXY(p), b = nodeXY(n);
        const x1 = a.x + NODE_W / 2, y1 = a.y + NODE_H, x2 = b.x + NODE_W / 2, y2 = b.y;
        const mid = y1 + (y2 - y1) / 2;
        const d = x1 === x2 ? 'M' + x1 + ' ' + y1 + 'V' + y2 : 'M' + x1 + ' ' + y1 + 'V' + mid + 'H' + x2 + 'V' + y2;
        links += '<path data-link="' + n.id + '" d="' + d + '"/>';
      });
    });
    let labels = '';
    BRANCHES.forEach(function (b, col) {
      if (!b) return;
      labels += '<div class="branch-label" style="left:' + (col * COLW + (COLW - NODE_W) / 2) + 'px;top:' + (TOP + 34) + 'px">' + b + '</div>';
    });
    const nodes = PG.TECH.map(function (n) {
      const xy = nodeXY(n);
      const style = 'left:' + xy.x + 'px;top:' + xy.y + 'px' + (n.kind === 'era' ? ';--rc:' + PG.ERAS[n.era].color : '');
      return '<button class="node ' + (n.kind === 'era' ? 'era ' : '') + (n.kind === 'root' ? 'root ' : '') + '" type="button" data-act="node" data-id="' + n.id +
        '" style="' + style + '"><span class="ico">' + nodeIcon(n) + '</span><span class="nm">' + esc(n.name) + '</span><span class="lv num"></span></button>';
    }).join('');
    const canP = PG.canPrestige(S);
    view.innerHTML = '<div class="view-title"><h1>Tech Tree</h1></div>' +
      '<p class="view-sub">Spend coins on upgrades. Unlock new eras down the middle; each era adds 60 rarer weapons. Scroll sideways to see every branch.</p>' +
      '<div class="tree-scroll" id="tree-scroll"><div class="tree" style="width:' + w + 'px;height:' + h + 'px">' +
      '<svg class="links" width="' + w + '" height="' + h + '" aria-hidden="true">' + links + '</svg>' + labels + nodes + '</div></div>' +
      '<div class="prestige"><h2>' + ICON.medal.replace('<svg', '<svg width="22" height="22" style="vertical-align:-3px"') + ' Prestige</h2>' +
      '<p class="muted" style="margin:0">Start a fresh run with an empty collection and earn Medals. Every Medal makes cards sell for 1% more and adds 0.2 Luck, for good.</p>' +
      '<div>You have <b class="num">' + S.medals + '</b> medals. Prestiging now earns <b class="num">' + PG.medalsFor(S) + '</b> (1 per ' + PG.RULES.medalStarCards + ' star cards, plus ' + PG.RULES.medalWinBonus + ' if you have won).</div>' +
      '<div><button class="btn primary" type="button" data-act="prestige"' + (canP ? '' : ' disabled') + '>Prestige…</button> ' +
      (canP ? '' : '<span class="muted">Own all 420 weapons first (' + PG.ownedCount(S) + ' / 420).</span>') + '</div></div>';
    updateTech(true);
  }

  function updateTech() {
    const tree = $('.tree', view);
    if (!tree) return;
    $$('.node', tree).forEach(function (el) {
      const id = el.dataset.id, n = PG.TECH_BY_ID[id];
      const state = PG.techState(S, id);
      const lvl = PG.level(S, id);
      const cost = PG.techCost(S, id);
      el.classList.toggle('maxed', state === 'maxed');
      el.classList.toggle('locked', state === 'locked');
      el.classList.toggle('open', state === 'open');
      el.classList.toggle('part', lvl > 0 && state !== 'maxed');
      el.classList.toggle('afford', state === 'open' && S.coins >= cost);
      let lv;
      if (n.kind === 'root') lv = 'BASE';
      else if (state === 'maxed') lv = n.max > 1 ? 'MAX' : 'OWNED';
      else lv = (n.max > 1 ? lvl + '/' + n.max + ' · ' : '') + fmt(cost);
      const lvEl = el.querySelector('.lv');
      if (lvEl.textContent !== lv) lvEl.textContent = lv;
    });
    $$('svg.links path', tree).forEach(function (p) { p.classList.toggle('on', PG.level(S, p.dataset.link) > 0); });
  }

  // Short description of a node's effect at a given level.
  function effectText(id, level) {
    const copy = JSON.parse(JSON.stringify(S.tech));
    copy[id] = level;
    const st = PG.stats(Object.assign({}, S, { tech: copy }));
    const n = PG.TECH_BY_ID[id];
    const range = function (packId) { return cardsText(PG.packCards(S, PG.PACK_BY_ID[packId], st)); };
    if (n.kind === 'era') return level ? 'Unlocked' : 'Locked';
    switch (id) {
      case 'sup_timer': return 'Free pack every ' + st.freeTime + ' s';
      case 'sup_tap': return '−' + st.tapPower + ' s per tap';
      case 'sup_stock': return 'Holds ' + plural(st.freeStockMax, 'free pack');
      case 'sup_better': return 'Free pack: ' + PG.PACK_BY_ID[st.freePack].name;
      case 'spd_1': case 'spd_2': return 'Opening takes ' + Math.round(st.speedMult * 100) + '% of the normal time';
      case 'spd_instant': return level ? 'Animation can be skipped' : 'Animation always plays';
      case 'blk_1': case 'blk_2': return 'Open up to ' + st.bulkMax + ' at once';
      case 'val_1': case 'val_2': case 'val_3': case 'val_4': return 'Cards sell for ×' + st.valueMult.toFixed(2) + (st.boughtValueMult > st.valueMult + 1e-9 ? ' (×' + st.boughtValueMult.toFixed(2) + ' for duplicates from bought packs)' : '');
      case 'lck_1': case 'lck_2': case 'lck_3': case 'lck_4': return 'Luck ' + (Math.round(st.luck * 10) / 10) + ' (' + (Math.round(st.luck * PG.RULES.boughtLuck * 10) / 10) + ' in packs you buy)';
      case 'qm_disc': return 'Packs cost ' + Math.round(st.discount * 100) + '% less';
      case 'qm_small': return 'Supply Crate ' + range('supply') + ', Ammo Box ' + range('ammo');
      case 'qm_era': return 'Era packs: ' + range('era0');
      case 'qm_mid': return 'Armory Crate ' + range('armory') + ', War Chest ' + range('warchest');
      case 'qm_big': return 'Black Ops Case ' + range('blackops') + ', Doomsday Vault ' + range('vault');
      case 'sto_1': case 'sto_2': return 'Storage holds ' + fmt(st.storageCap);
      case 'sto_sell': return ['Each tap sells 1 copy', 'Each tap sells every copy of a card', 'Sell All button'][level];
      case 'sto_auto': return level ? 'Auto-sells ' + st.sellRate + ' per second' : 'Off';
      case 'sto_fast': return 'Auto-sells ' + (st.sellRate === Infinity ? 'instantly' : st.sellRate + ' per second');
      case 'aut_1': return level ? 'Auto-Opener ready' : 'Off';
      case 'aut_2': return 'Waits ' + st.autoDelay + ' s between batches';
      case 'aut_load': case 'aut_line': return 'Auto-Opener opens up to ' + st.autoMax + ' at a time';
      case 'aut_claim': return level ? 'Free packs open themselves' : 'Off';
      default: return '';
    }
  }

  function openNodeSheet(id) {
    const n = PG.TECH_BY_ID[id];
    const lvl = PG.level(S, id);
    const state = PG.techState(S, id);
    const cost = PG.techCost(S, id);
    let body = '<p class="fact">' + esc(n.desc) + '</p>';
    if (n.kind !== 'root') {
      body += '<dl class="kv"><dt>Level</dt><dd class="num">' + lvl + ' / ' + n.max + '</dd><dt>Now</dt><dd>' + esc(effectText(id, lvl)) + '</dd>' +
        (state !== 'maxed' ? '<dt>Next</dt><dd>' + esc(effectText(id, lvl + 1)) + '</dd>' : '') + '</dl>';
    }
    const blockers = PG.techBlockers(S, id);
    if (state === 'locked') body += '<div class="lock-note" style="margin:12px 0 0">' + blockers.map(esc).join('<br>') + '</div>';
    if (state === 'open') {
      body += '<div class="stack"><button class="btn primary num" type="button" data-act="tech-buy" data-id="' + id + '"' + (S.coins < cost ? ' disabled' : '') + '>' +
        (n.kind === 'era' ? 'Unlock' : lvl ? 'Upgrade' : 'Buy') + ' · ' + COIN + ' ' + fmt(cost) + '</button>' +
        (S.coins < cost ? '<span class="muted">You need ' + fmt(cost - S.coins) + ' more coins.</span>' : '') + '</div>';
    }
    if (state === 'maxed' && n.kind !== 'root') body += '<p><b>Fully upgraded.</b></p>';
    openSheet('<span class="ico" style="display:inline-grid;width:34px;height:34px;vertical-align:-6px;margin-right:6px">' + nodeIcon(n) + '</span>' + esc(n.name), body);
  }

  // ── Bottom sheet ─────────────────────────────────────────────────────
  function openSheet(title, body) {
    closeSheet();
    const back = document.createElement('div');
    back.className = 'sheet-back';
    back.id = 'sheet';
    back.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-top"><h2 id="sheet-title">' + title +
      '</h2><button class="icon-btn" type="button" data-act="close-sheet" aria-label="Close">' + ICON.close + '</button></div>' + body + '</div>';
    back.addEventListener('click', function (e) { if (e.target === back) closeSheet(); });
    document.body.appendChild(back);
    ui.sheetOpen = true;
    const first = back.querySelector('.sheet .btn.primary') || back.querySelector('[data-act="close-sheet"]');
    if (first) first.focus({ preventScroll: true });
  }
  function closeSheet() {
    const s = $('#sheet');
    if (s) s.remove();
    ui.sheetOpen = false;
    ui.skinsOpen = false;
  }

  function openCardSheet(id) {
    const c = PG.CARDS[id], era = PG.ERAS[c.era];
    const best = S.owned[id] || 0;
    const owned = best > 0;
    let body = '<div class="detail-card">' + cardHTML(id, { owned: owned, star: best, mask: S.stars[id], static: true, shiny: !!S.shiny[id] }) + '</div>';
    // What this weapon sells for at each star, with your current upgrades.
    let worth = '<div class="odds-wrap"><table class="odds"><thead><tr><th>Stars</th>';
    for (let k = 1; k <= 5; k++) worth += '<th>' + k + '★</th>';
    worth += '</tr></thead><tbody><tr><td>Sells for</td>';
    for (let k = 1; k <= 5; k++) worth += '<td>' + (PG.hasStar(S, id, k) ? '<b>' + fmt(PG.sellValue(S, id, k)) + '</b>' : fmt(PG.sellValue(S, id, k))) + '</td>';
    worth += '</tr></tbody></table></div>';
    if (owned) {
      const spares = [1, 2, 3, 4, 5].map(function (k) { return S.dupes[PG.dupeKey(id, k)] ? (S.dupes[PG.dupeKey(id, k)] + '× ' + k + '★') : ''; })
        .filter(Boolean).join(', ');
      body += '<p class="fact">' + esc(c.fact) + '</p><dl class="kv">' +
        '<dt>Rank</dt><dd>#' + c.rank + ' of 420 (oldest to newest)</dd>' +
        '<dt>Year</dt><dd>' + esc(PG.formatYear(c.year)) + '</dd>' +
        '<dt>Type</dt><dd>' + esc(PG.CATEGORY_LABELS[c.cat] || '') + '</dd>' +
        '<dt>Rarity</dt><dd>' + rarityLabel(PG.tierOf(c.era, best)) + ' · ' + esc(era.name) + ' era</dd>' +
        '<dt>Stars you have</dt><dd>' + [1, 2, 3, 4, 5].filter(function (k) { return PG.hasStar(S, id, k); }).map(function (k) {
          const n = PG.copiesOf(S, id, k);
          return k + '★' + (n > 1 ? ' <span class="muted">(×' + fmtShort(n) + ' pulled)</span>' : '');
        }).join(', ') +
        (missingStars(id).length ? ' <span class="muted">(still need ' + missingStars(id).join(', ') + ')</span>' : ' (all five!)') + '</dd>' +
        '<dt>Duplicates</dt><dd class="num">' + (spares || 'none') + '</dd>' +
        '<dt>Shiny</dt><dd>' + (S.shiny[id] ? '<span class="shiny-line">✦ You have it</span>' : 'Not yet <span class="muted">(1 in 500 pulls is shiny)</span>') + '</dd></dl>' + worth;
    } else {
      const packs = PG.PACKS.filter(function (p) {
        return PG.packUnlocked(S, p) && PG.packOdds(S, p).some(function (o) { return Math.floor(o.tier / 5) === c.era; });
      });
      body += '<p class="fact">Not collected yet. This is weapon #' + c.rank + ', a ' + esc(era.rarity) + ' weapon from the ' + esc(era.name) + ' era. It can drop with 1 to 5 stars.</p>';
      if (c.era >= PG.erasUnlocked(S)) body += '<p>Unlock the ' + esc(era.name) + ' era in the Tech tree before it can drop.</p>';
      else if (packs.length) {
        body += '<p>It can drop from: ' + packs.map(function (p) {
          let eraP = 0;
          PG.packOdds(S, p).forEach(function (o) { if (Math.floor(o.tier / 5) === c.era) eraP += o.p; });
          const r = PG.packCards(S, p);
          return '<b>' + esc(p.name) + '</b> (' + chance(eraP * PG.weaponShare(id) * (r[0] + r[1]) / 2) + ' per pack)';
        }).join(', ') + '.</p>';
      }
      body += worth;
    }
    openSheet(owned ? esc(c.name) : 'Weapon #' + c.rank, body);
  }

  function openOddsSheet(packId) {
    const pack = PG.PACK_BY_ID[packId];
    const st = PG.stats(S);
    const odds = PG.packOdds(S, pack, st);
    const byTier = {};
    odds.forEach(function (o) { byTier[o.tier] = o.p; });
    const eras = [];
    odds.forEach(function (o) { const e = Math.floor(o.tier / 5); if (eras.indexOf(e) < 0) eras.push(e); });
    let rows = '';
    const starTotals = [0, 0, 0, 0, 0];
    eras.forEach(function (e) {
      let sum = 0, cells = '';
      for (let s = 0; s < 5; s++) {
        const p = byTier[e * 5 + s] || 0;
        sum += p;
        starTotals[s] += p;
        cells += '<td class="' + (p ? '' : 'zero') + '">' + (p ? oddsCell(p) : '—') + '</td>';
      }
      rows += '<tr><td><span class="rar" style="--rc:' + PG.ERAS[e].color + '">' + PG.ERAS[e].rarity + '</span></td>' + cells + '<td><b>' + chance(sum) + '</b></td></tr>';
    });
    // Each star over every rarity.
    if (eras.length > 1) {
      rows += '<tr class="all"><td><b>All</b></td>' + starTotals.map(function (p) {
        return '<td class="' + (p ? '' : 'zero') + '"><b>' + (p ? oddsCell(p) : '—') + '</b></td>';
      }).join('') + '<td><b>100%</b></td></tr>';
    }
    const perks = packPerks(pack, st);
    const body = '<p>This pack holds <b>' + cardRange(pack) + '</b>. These are the chances for each card. ' + (pack.eraOnly !== undefined ? 'This pack only holds ' + esc(PG.ERAS[pack.eraOnly].name) + ' weapons.' :
      'Odds include every era you have unlocked; new eras add rarer rows.') + (perks ? ' Bought packs: <b>' + perks + '</b>.' : '') +
      (st.luck ? ' Your Luck (' + (Math.round(st.luck * 10) / 10) + ') counts double in packs you buy and is included.' : '') +
      ' Every card rolls its stars after its rarity: 1★ is most common and 5★ is rare. Inside a rarity, newer weapons drop a little less often (the newest about half as often as the oldest). Mythical 5★ is the rarest card in the game and only drops from the Doomsday Vault and the Modern Pack.</p>' +
      '<div class="odds-wrap"><table class="odds"><thead><tr><th>Rarity</th><th>1★</th><th>2★</th><th>3★</th><th>4★</th><th>5★</th><th>Total</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
    openSheet(esc(pack.name) + ' odds', body);
  }

  function openSettings() {
    const st = PG.stats(S);
    const where = PG.Save.cloudState === 'on' ? 'Your progress is saved on this device and in your Claude account, so it follows you between devices.'
      : PG.Save.localOK ? 'Your progress is saved on this device only. If the game ever starts over when you come back, restore it with a backup code.'
        : 'This app isn’t letting the game save on this device, so your progress is lost when you leave. Copy a backup code before you go.';
    const body =
      '<div class="stack">' +
      (st.instantOwned ? '<label class="switch"><input type="checkbox" data-change="instant"' + (S.settings.instant ? ' checked' : '') + '> Instant Open (skip the animation)</label>' : '') +
      '<label class="switch"><input type="checkbox" data-change="sound"' + (S.settings.sound ? ' checked' : '') + '> Sound effects</label>' +
      (S.settings.sound ? '<label class="vol"><span>Volume</span><input type="range" min="0" max="100" step="5" value="' + Math.round(S.settings.volume * 100) +
        '" data-change="volume" aria-label="Sound volume"></label>' : '') +
      '<label class="switch"><input type="checkbox" data-change="vibrate"' + (S.settings.vibrate ? ' checked' : '') + '> Vibrate on big pulls</label>' +
      '<label class="switch"><input type="checkbox" data-change="profit"' + (S.settings.showProfit ? ' checked' : '') + '> Show profit or loss on cards you pull</label>' +
      '<button class="btn" type="button" data-act="help">How to play</button>' +
      '<button class="btn" type="button" data-act="skins">' + ICON.palette.replace('<svg', '<svg width="18" height="18" style="vertical-align:-3px"') + ' Crate &amp; card skins' +
      (Object.keys(S.skins.fresh).length ? ' <span class="new-pill">' + Object.keys(S.skins.fresh).length + ' new</span>' : '') + '</button>' +
      '<div class="save-box"><p>' + where + '</p><div class="row2">' +
      '<button class="btn" type="button" data-act="backup">Copy backup code</button>' +
      '<button class="btn" type="button" data-act="restore">Restore from code</button></div></div>' +
      '<button class="btn" type="button" data-act="goto-stats">' + ICON.chart.replace('<svg', '<svg width="18" height="18" style="vertical-align:-3px"') + ' All your stats</button>' +
      '<button class="btn danger" type="button" data-act="reset">Erase all progress…</button></div>';
    openSheet('Settings', body);
  }

  // ── Skins ────────────────────────────────────────────────────────────
  function backClass(id) { return 'cb-' + id.replace('back-', ''); }
  function openSkins() {
    const prev = $('#sheet .sheet');
    const top = prev && ui.skinsOpen ? prev.scrollTop : 0;
    const all = PG.allTime(S);
    const tile = function (k) {
      const got = !!S.skins.got[k.id];
      const using = S.skins[k.kind] === k.id;
      const pr = PG.skinProgress(S, k.id, all);
      const preview = k.kind === 'crate' ? '<span class="sk-crate">' + crateSVG(PG.PACK_BY_ID.armory, k.id) + '</span>'
        : '<span class="sk-back ' + backClass(k.id) + '"><span>?</span></span>';
      return '<button class="skin' + (using ? ' using' : '') + (got ? '' : ' locked') + '" type="button" data-act="skin" data-id="' + k.id + '" aria-pressed="' + using + '">' +
        preview + (S.skins.fresh[k.id] ? '<span class="sk-new">NEW</span>' : '') +
        '<span class="sk-name">' + esc(k.name) + '</span>' +
        '<span class="sk-state">' + (using ? '✓ In use' : got ? 'Tap to use'
          : ICON.lock.replace('<svg', '<svg width="12" height="12" style="vertical-align:-1px"') + ' ' + esc(k.need) +
            (k.goal > 1 ? '<br><b class="num">' + fmt(pr.have) + ' / ' + fmt(pr.goal) + '</b>' : '')) + '</span></button>';
    };
    const group = function (kind, title) {
      const list = PG.SKINS.filter(function (k) { return k.kind === kind; });
      const have = list.filter(function (k) { return S.skins.got[k.id]; }).length;
      return '<div class="sk-sec"><span>' + title + '</span><span class="num">' + have + ' / ' + list.length + '</span></div><div class="skins">' + list.map(tile).join('') + '</div>';
    };
    openSheet(ICON.palette.replace('<svg', '<svg width="22" height="22" style="vertical-align:-4px;margin-right:6px"') + 'Skins',
      '<p class="muted" style="margin:0 0 4px">They only change how things look, never odds or prices. New ones unlock as you play, and you keep them when you prestige.</p>' +
      group('crate', 'Crates') + group('back', 'Card backs') +
      '<div class="stack"><button class="btn primary" type="button" data-act="close-sheet">Done</button></div>');
    ui.skinsOpen = true;
    if (top) $('#sheet .sheet').scrollTop = top;
    // Seen now: the NEW tags go after this visit.
    S.skins.fresh = {};
  }

  function openHelp(first) {
    const body =
      '<p class="fact">Collect all <b>420 real weapons</b>, ranked from the oldest (a thrown stone, #1) to the newest (#420).</p>' +
      '<p><b>Rarity comes from the era.</b> Ancient weapons are Common, then Medieval (Uncommon), Gunpowder (Rare), Industrial (Very Rare), World Wars (Epic), Cold War (Legendary) and Modern (Mythical).</p>' +
      '<p><b>Every card rolls 1 to 5 stars</b> when it drops: 1★ 60%, 2★ 25%, 3★ 10%, 4★ 4%, 5★ 1%. Better packs and Luck make high stars likelier. Each star doubles what a card is worth. <b>Every star is its own card</b>: your collection keeps one of each (1★ through 5★) of every weapon, and each new one pays its value in coins as a collection reward. Mythical 5★ is the hardest card of all: it only drops from the Doomsday Vault and the Modern Pack.</p>' +
      '<p><b>To win</b>, collect every weapon at every star: 2,100 cards.</p>' +
      '<p><b>Inside each rarity</b>, newer weapons drop a little less often than older ones.</p>' +
      '<p><b>Free pack every minute</b> with 1 to 3 cards. Tap it to make the timer go faster.</p>' +
      '<p><b>Bought packs</b> hold a range of cards (like 3–7) and better packs have better odds. From the Ammo Box up, one card is always at least the pack\'s own rarity, and the War Chest, Black Ops Case and Doomsday Vault never give 1★ cards. The era packs do, so that is where to find 1★ cards of each rarity (from the Very Rare pack up, without lowering their 5★ chance). Luck counts double in packs you buy. The <b>Packs</b> branch of the Tech tree makes packs cheaper and lets them hold more cards.</p>' +
      '<p><b>Prices</b> follow what can come out of a pack (unlocking a newer era makes the mixed packs pricier), but your upgrades never raise them. A <b>market</b> moves them every 3 minutes: a green tag means a pack is cheaper than normal. Buying up to ' + fmt(PG.RULES.demandFree) + ' of one pack within ' + Math.round(PG.RULES.demandWindow / 60) + ' minutes never changes its price. Past that, every extra one makes it 1% pricier (\u201cin demand\u201d) until those purchases are ' + Math.round(PG.RULES.demandWindow / 60) + ' minutes old. The Auto-Opener stops at the free amount and waits, so it never pays extra.</p>' +
      '<p><b>Mega Sales</b> sometimes hit the Doomsday Vault or Modern Pack. Their cards then sell for more than you pay, but only the first 5 packs get the sale price.</p>' +
      '<p><b>Duplicates</b> (a star you already have) go to Storage. Sell them for coins. Rarer cards sell for much more. If storage fills up, new duplicates are scrapped. When you open a pack, a duplicate\'s tag shows how many copies of it you\'ve pulled (×3 = your third), and a NEW card\'s tag shows the coins it paid.</p>' +
      '<p><b>The Tech tree</b> unlocks new eras and upgrades opening speed, card value, luck, storage, how many packs you open at once, bought packs, and an Auto-Opener. The Auto-Opener starts slow, one pack every 4 seconds; Conveyor Belt and Auto Loader speed it up, and the Assembly Line (15 at a time) is the most expensive upgrade in the game.</p>' +
      '<p><b>Shiny cards</b>: about 1 card in ' + Math.round(1 / PG.RULES.shinyChance) + ' comes out shiny, with a foil shine. A shiny pull pays ' + (PG.RULES.shinyMult - 1) + ' times the card\'s value on top, and it joins your shiny collection (one per weapon), which you keep when you prestige.</p>' +
      '<p><b>Golden packs</b>: about 1 in ' + Math.round(1 / PG.RULES.goldenChance) + ' of the openings you start yourself glows gold, and one card in it is a guaranteed 5★. The Auto-Opener\'s packs never turn golden.</p>' +
      '<p><b>Saving</b>: the game saves by itself on this device (and, for players who can write to it, in their Claude account). In Settings you can copy a <b>backup code</b>: paste it back in on any device to get your game back.</p>' +
      '<p><b>Skins</b>: crate skins and card backs unlock as you reach milestones. Pick them in Settings. They only change how things look, and you keep them when you prestige.</p>' +
      '<p><b>Prestige</b> once you own all 420 weapons (any star): start over and earn Medals that make every future run stronger. The more star cards you have, the more Medals you get.</p>' +
      '<div class="stack"><button class="btn primary" type="button" data-act="close-sheet">' + (first ? 'Start collecting' : 'Close') + '</button>' +
      (first ? '<button class="btn" type="button" data-act="restore">I have a backup code</button>' : '') + '</div>';
    openSheet(first ? 'Welcome to Arsenal of Ages' : 'How to play', body);
  }

  // ── Opening packs ────────────────────────────────────────────────────
  function startOpen(res, again) {
    if (!res || !res.ok) { if (res && res.reason) toast(res.reason, 'bad'); return; }
    ui.viewDirty = true;
    const st = PG.stats(S);
    const results = res.results.slice();
    const total = results.length;
    const newCount = results.filter(function (r) { return r.fate === 'new'; }).length;
    const newStars = results.filter(function (r) { return r.fate === 'star'; });
    const sold = results.filter(function (r) { return r.fate === 'sold'; });
    const stored = results.filter(function (r) { return r.fate === 'stored'; }).length;
    const scrapped = results.filter(function (r) { return r.fate === 'scrapped'; }).length;
    const soldCoins = sold.reduce(function (a, r) { return a + r.value; }, 0);
    const keepers = function (r) { return r.fate === 'new' || r.fate === 'star'; };
    const reward = results.filter(keepers).reduce(function (a, r) { return a + (r.value || 0); }, 0);
    // Profit view (Settings): what each card brings in coins against its share of the price.
    const showProfit = S.settings.showProfit;
    // Each card's share is its own pack's price split over that pack's cards.
    const coinsOf = function (r) { return (r.fate === 'scrapped' ? 0 : (r.value || 0) + (r.extra || 0)) + (r.shinyCoins || 0); };
    const perPack = res.qty ? res.cost / res.qty : 0;
    const packCards = {}, packGot = {};
    results.forEach(function (r) {
      packCards[r.pk] = (packCards[r.pk] || 0) + 1;
      packGot[r.pk] = (packGot[r.pk] || 0) + coinsOf(r);
    });
    const packIds = Object.keys(packCards);
    const packsAhead = packIds.filter(function (k) { return packGot[k] >= perPack; }).length;
    const gotTotal = results.reduce(function (a, r) { return a + coinsOf(r); }, 0);
    const profitTag = function (r) {
      const d = coinsOf(r) - perPack / (packCards[r.pk] || 1);
      return d >= 0 ? '<span class="pl up" title="Profit">▲ +' + fmtShort(d) + '</span>' : '<span class="pl down" title="Loss">▼ −' + fmtShort(-d) + '</span>';
    };
    if (res.won) ui.pendingWin = true;

    // Which cards to show: everything for small batches, otherwise the new ones plus the best of the rest.
    let shown = results;
    const special = function (r) { return keepers(r) || r.shiny || r.golden; };
    const shinies = results.filter(function (r) { return r.shiny; });
    const goldenCard = results.find(function (r) { return r.golden; });
    if (total > 60) {
      const fresh = results.filter(special);
      const rest = results.filter(function (r) { return !special(r); }).sort(function (a, b) { return pullTier(b) - pullTier(a); });
      shown = fresh.concat(rest.slice(0, Math.max(0, 40 - fresh.length)));
    }
    shown = shown.slice().sort(function (a, b) { return pullTier(a) - pullTier(b) || keepers(a) - keepers(b); });

    // Celebrate the best card: Epic or better, a fresh Very Rare+, or any 5★ from Rare up.
    const best = shown[shown.length - 1];
    const bestCard = PG.CARDS[best.id];
    const bestTier = pullTier(best);
    const big = bestTier >= 20 || (keepers(best) && bestTier >= 15) || (best.star === 5 && bestCard.era >= 2);

    closeSheet();
    const ov = document.createElement('div');
    ov.className = 'open-ov';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.setAttribute('aria-label', 'Opening ' + res.pack.name);
    const instant = PG.instantOn(S);
    ov.innerHTML = '<div class="ov-title">' + (res.free ? 'Free ' : '') + esc(res.pack.name) + (res.qty > 1 ? ' ×' + res.qty : '') + '</div>' +
      '<div class="stage"><div class="crate-big' + (instant ? '' : ' shake') + (goldenCard ? ' golden' : '') + '"' + (instant ? ' hidden' : '') + '>' + crateSVG(res.pack) + '</div>' +
      '<div class="banner-slot">' + (goldenCard ? '<div class="gold-banner">GOLDEN PACK! One card is a guaranteed 5★</div>' : '') + '</div>' +
      '<div class="reveal' + (shown.length > 12 ? ' small' : '') + '" hidden></div>' +
      '<div class="ov-summary" hidden></div><div class="ov-actions" hidden></div></div><div class="flash"></div>';
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    ui.overlay = ov;
    if (goldenCard) { vibrate([40, 40, 40, 40, 120]); PG.Sound.play('golden'); }

    const reveal = $('.reveal', ov);
    reveal.style.maxWidth = (shown.length > 12 ? 720 : Math.min(shown.length, 5) * 140) + 'px';
    reveal.innerHTML = shown.map(function (r) {
      // New cards also show the coins their collection reward paid (their value); repeats
      // show how many copies of that weapon at that star you've pulled, this one included.
      const paid = r.value ? ' +' + fmtShort(r.value) : '';
      const badge = r.fate === 'new' ? '<span class="badge">NEW' + paid + '</span>'
        : r.fate === 'star' ? '<span class="badge up">NEW ' + r.star + '★' + paid + '</span>'
          : r.fate === 'scrapped' ? '<span class="badge scrap">SCRAP</span>'
            : '<span class="badge repeat" title="Copies you\'ve pulled">×' + fmtShort(r.copies) + '</span>';
      return '<div class="flip' + (instant ? '' : ' down') + '"><div class="inner"><div class="face">' +
        cardHTML(r.id, { star: r.star, badge: badge, art: showProfit ? profitTag(r) : '', shiny: r.shiny, golden: r.golden }) +
        '</div><div class="back ' + backClass(S.skins.back) + '"><span>?</span></div></div></div>';
    }).join('');

    const m = st.speedMult;
    const introMs = instant ? 0 : 1100 * m;
    const flipTotal = instant ? 0 : 1000 * m * (0.42 * Math.min(shown.length, 10) + 1.6 * Math.min(1, Math.max(0, shown.length - 10) / 40));
    const step = shown.length ? flipTotal / shown.length : 0;
    const timers = [];
    ui.overlayTimers = timers;

    function finish() {
      $$('.flip.down', ov).forEach(function (f) { f.classList.remove('down'); });
      if (shinies.length) {
        // A shiny beats any other celebration.
        const sh = shinies[shinies.length - 1];
        $('.banner-slot', ov).innerHTML = '<div class="big-banner shiny-banner">✦ SHINY ' + esc(PG.CARDS[sh.id].name.toUpperCase()) + '! ✦</div>';
        const fl = $('.flash', ov);
        fl.style.setProperty('--fc', '#dff3ff');
        fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
        vibrate([60, 40, 60, 40, 160]);
        PG.Sound.play('shiny');
      } else if (big) {
        const label = (keepers(best) ? 'NEW ' : '') + PG.ERAS[bestCard.era].rarity.toUpperCase() + ' ' + best.star + '★!';
        const slot = $('.banner-slot', ov);
        slot.innerHTML = '<div class="big-banner" style="--bc:' + PG.ERAS[bestCard.era].color + '">' + label + '</div>';
        const fl = $('.flash', ov);
        fl.style.setProperty('--fc', PG.ERAS[bestCard.era].color);
        fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
        vibrate(bestTier >= 30 || best.star === 5 ? [80, 60, 160] : 60);
      }
      const lines = [];
      const dupeCount = total - newCount - newStars.length;
      const parts = [];
      if (newCount) parts.push('<b>' + plural(newCount, 'new weapon') + '</b>');
      if (newStars.length) parts.push('<b>' + plural(newStars.length, 'new star') + '</b>');
      if (dupeCount) parts.push(plural(dupeCount, 'duplicate'));
      lines.push(parts.join(' · '));
      shinies.forEach(function (r) {
        lines.push('<span class="shiny-line">✦ Shiny ' + esc(PG.CARDS[r.id].name) + '! +' + fmt(r.shinyCoins) + ' coins' +
          (r.shinyNew ? ' · new in your shiny collection' : '') + '</span>');
      });
      if (goldenCard) lines.push('<span class="gold-line">Golden pack: ' + esc(PG.CARDS[goldenCard.id].name) + ' ' + goldenCard.star + '★</span>');
      if (showProfit) {
        const net = gotTotal - res.cost;
        lines.push(res.cost ? (net >= 0 ? '<span class="pl-line up">Profit: <b>+' + fmt(net) + '</b> coins</span>' : '<span class="pl-line down">Loss: <b>−' + fmt(-net) + '</b> coins</span>') +
          ' (cards worth ' + fmt(gotTotal) + ', you paid ' + fmt(res.cost) + ')' +
          (packIds.length > 1 ? '<br>' + packsAhead + ' of ' + packIds.length + ' packs made a profit' : '')
          : '<span class="pl-line up">Free ' + (res.qty > 1 ? 'packs' : 'pack') + ': <b>+' + fmt(gotTotal) + '</b> coins of cards</span>');
      }
      if (reward) lines.push('Collection reward: <b>+' + fmt(reward) + '</b> coins');
      if (soldCoins) lines.push('Auto-sold for <b>' + fmt(soldCoins) + '</b> coins');
      if (res.bonus) lines.push('Bought-pack bonus: <b>+' + fmt(res.bonus) + '</b> coins (card value upgrades count double)');
      if (stored) lines.push(plural(stored, 'duplicate') + ' sent to Storage');
      if (scrapped) lines.push('<span class="warn">' + plural(scrapped, 'duplicate') + ' scrapped: storage is full</span>');
      if (total > shown.length) lines.push('Showing ' + shown.length + ' of ' + total + ' cards (every new card plus the rarest repeats)');
      const sum = $('.ov-summary', ov);
      sum.innerHTML = lines.map(function (l) { return '<div>' + l + '</div>'; }).join('');
      sum.hidden = false;
      const acts = $('.ov-actions', ov);
      let againBtn = '';
      if (again) {
        const a = again.label();
        againBtn = '<button class="btn" type="button" data-ov="again"' + (a.ok ? '' : ' disabled') + '>' + a.text + '</button>';
      }
      acts.innerHTML = againBtn + '<button class="btn primary" type="button" data-ov="done">Done</button>';
      acts.hidden = false;
      $('[data-ov="done"]', acts).focus({ preventScroll: true });
      acts.addEventListener('click', function (e) {
        const b = e.target.closest('[data-ov]');
        if (!b || b.disabled) return;
        if (b.dataset.ov === 'done') closeOverlay();
        else { closeOverlay(); startOpen(again.run(), again); }
      });
    }

    // Sounds follow the cards: a flick for each, and a chime for a new one.
    const flipSound = function (r) { PG.Sound.play('flip', { era: PG.CARDS[r.id].era, star: r.star, isNew: keepers(r) }); };
    if (instant) {
      PG.Sound.play('burst');
      const fresh = shown.filter(keepers);
      if (fresh.length) flipSound(fresh[fresh.length - 1]);
      reveal.hidden = false; finish(); return;
    }
    PG.Sound.play('shake', { dur: introMs / 1000 });
    timers.push(setTimeout(function () {
      const crate = $('.crate-big', ov);
      PG.Sound.play('burst');
      crate.classList.remove('shake'); crate.classList.add('burst');
      timers.push(setTimeout(function () {
        crate.hidden = true;
        reveal.hidden = false;
        const flips = $$('.flip', reveal);
        flips.forEach(function (f, i) {
          timers.push(setTimeout(function () { f.classList.remove('down'); flipSound(shown[i]); }, 120 + i * step));
        });
        timers.push(setTimeout(finish, 120 + flips.length * step + 250));
      }, 300));
    }, introMs));
  }

  function closeOverlay() {
    if (ui.overlayTimers) ui.overlayTimers.forEach(clearTimeout);
    if (ui.overlay) ui.overlay.remove();
    ui.overlay = null;
    document.body.style.overflow = '';
    ui.viewDirty = true;
    renderView(true);
    if (ui.pendingWin) { ui.pendingWin = false; openWinSheet(); }
  }

  function openWinSheet() {
    PG.Sound.play('win');
    openSheet('🏆 You won!', '<p class="fact">You collected every one of the 420 weapons at every star, 1★ through 5★: all <b>2,100</b> cards, Mythical 5★ included.</p>' +
      '<p>Keep playing, or Prestige for <b>' + PG.medalsFor(S) + '</b> Medals (including ' + PG.RULES.medalWinBonus + ' for winning) and start a stronger run.</p>' +
      '<div class="stack"><button class="btn primary" type="button" data-act="close-sheet">Keep playing</button></div>');
  }

  // Openings you start yourself can turn golden (the Auto-Opener's can't).
  const MANUAL = { manual: true };
  function buyAgain(packId) {
    return {
      run: function () {
        const qty = Math.min(S.settings.qty, PG.stats(S).bulkMax);
        return PG.buyPacks(S, packId, qty, null, MANUAL);
      },
      label: function () {
        const pack = PG.PACK_BY_ID[packId];
        const qty = Math.min(S.settings.qty, PG.stats(S).bulkMax);
        const cost = PG.packPrice(S, pack) * qty;
        return { ok: S.coins >= cost, text: 'Open again' + (qty > 1 ? ' ×' + qty : '') + ' · ' + COIN + ' ' + fmt(cost) };
      }
    };
  }
  const freeAgain = {
    run: function () { return PG.openFree(S, null, MANUAL); },
    label: function () { return { ok: S.free.stock > 0, text: S.free.stock > 0 ? 'Open next free pack' : 'Next free pack in ' + clock(S.free.timer) }; }
  };

  // ── Actions ──────────────────────────────────────────────────────────
  function floater(btn, text, e) {
    const r = btn.getBoundingClientRect();
    const f = document.createElement('span');
    f.className = 'floater';
    f.textContent = text;
    const x = e && e.clientX ? e.clientX - r.left : r.width / 2;
    const y = e && e.clientY ? e.clientY - r.top : r.height / 2;
    f.style.left = (x - 14) + 'px';
    f.style.top = (y - 20) + 'px';
    btn.appendChild(f);
    setTimeout(function () { f.remove(); }, 700);
  }

  const actions = {
    tab: function (b) { setTab(b.dataset.tab); },
    'goto-free': function () { setTab('shop'); },
    'goto-stats': function () { closeSheet(); setTab('stats'); },
    'goto-mega': function () {
      const row = S.market.mega && $('#pack-' + S.market.mega.pack);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    free: function (b, e) {
      if (S.free.stock > 0) { startOpen(PG.openFree(S, null, MANUAL), freeAgain); return; }
      const st = PG.stats(S);
      const made = PG.tapFree(S);
      floater(b, '−' + st.tapPower + 's', e);
      PG.Sound.play(made ? 'ready' : 'tap');
      if (made) vibrate(25);
      updateShop();
    },
    buy: function (b) {
      const qty = Math.min(S.settings.qty, PG.stats(S).bulkMax);
      startOpen(PG.buyPacks(S, b.dataset.pack, qty, null, MANUAL), buyAgain(b.dataset.pack));
    },
    odds: function (b) { openOddsSheet(b.dataset.pack); },
    qty: function (b) { S.settings.qty = +b.dataset.n; renderView(true); },
    card: function (b) { openCardSheet(+b.dataset.id); },
    era: function (b) { ui.era = +b.dataset.era; renderView(true); },
    sell: function (b, e) {
      const st = PG.stats(S);
      const key = b.dataset.key;
      const got = PG.sellDupe(S, key, st.sellMode >= 1 ? S.dupes[key] : 1);
      if (got) { floater(b.closest('.dupe') || b, '+' + fmt(got), e); PG.Sound.play('coin'); }
      updateStorage(true);
    },
    'sell-all': function () {
      const got = PG.sellAll(S);
      if (got) { toast('Sold everything for ' + fmt(got) + ' coins.', 'gold'); PG.Sound.play('coin', { count: 5 }); }
      updateStorage(true);
    },
    node: function (b) { openNodeSheet(b.dataset.id); },
    'tech-buy': function (b) {
      const id = b.dataset.id;
      const n = PG.TECH_BY_ID[id];
      const res = PG.buyTech(S, id);
      if (!res.ok) { toast(res.reason, 'bad'); PG.Sound.play('nope'); return; }
      PG.Sound.play(n.kind === 'era' ? 'fanfare' : 'upgrade');
      if (n.kind === 'era') {
        toast('New era unlocked: ' + PG.ERAS[n.era].name + '! 60 ' + PG.ERAS[n.era].rarity + ' weapons can now drop.', 'gold');
        ui.era = n.era;
        vibrate([40, 40, 80]);
      } else toast(n.name + (n.max > 1 ? ' level ' + res.level : '') + ' bought.', 'good');
      closeSheet();
      renderView(true);
    },
    'close-sheet': function () { closeSheet(); },
    backup: function () { openBackup(); },
    'copy-code': function () { copyCode(); },
    restore: function () { openRestore(); },
    'restore-go': function (b) {
      b.disabled = true;
      PG.Save.importCode($('#restore-code').value).then(function (s) {
        b.disabled = false;
        if (!s) { toast('That code didn’t work. Check that you copied all of it.', 'bad', 4000); return; }
        adoptState(s, 'Progress restored: ' + plural(PG.ownedCount(s), 'weapon') + '.');
      });
    },
    settings: function () { openSettings(); },
    help: function () { openHelp(false); },
    skins: function () { openSkins(); },
    skin: function (b) {
      const k = PG.SKIN_BY_ID[b.dataset.id];
      if (!S.skins.got[k.id]) { toast(k.need + ' to unlock ' + k.name + '.', 'bad'); PG.Sound.play('nope'); return; }
      PG.useSkin(S, k.id);
      openSkins();
      renderView(true);
    },
    'tip-done': function () { S.settings.tipDone = true; renderView(true); },
    reset: function (b) {
      if (Date.now() - ui.resetArmed > 4000) {
        ui.resetArmed = Date.now();
        b.textContent = 'Tap again to erase everything';
        return;
      }
      S = PG.newState();
      PG.Save.saveLocal(S);
      PG.Save.pushCloud(S, true);
      closeSheet();
      ui.feed = [];
      setTab('shop');
      toast('Progress erased. Fresh start!', 'good');
    },
    prestige: function () {
      if (!PG.canPrestige(S)) return;
      openSheet('Prestige?', '<p class="fact">You will start over: coins, cards, duplicates and tech all reset.</p>' +
        '<p>You keep your Medals and earn <b>' + PG.medalsFor(S) + '</b> more, for a total of <b>' + (S.medals + PG.medalsFor(S)) + '</b>.</p>' +
        '<div class="stack"><button class="btn primary" type="button" data-act="prestige-go">Prestige now</button>' +
        '<button class="btn" type="button" data-act="close-sheet">Not yet</button></div>');
    },
    'prestige-go': function () {
      const res = PG.prestige(S);
      if (!res) return;
      S = res.state;
      PG.Save.saveLocal(S);
      closeSheet();
      ui.feed = [];
      ui.era = 0;
      setTab('shop');
      toast('Prestige! +' + res.gained + ' medals. Every run from now on is stronger.', 'gold');
      PG.Sound.play('win');
    }
  };

  const changes = {
    'auto-on': function (el) { S.settings.autoOpen = el.checked; S.autoTimer = 0; ui.autoNote = ''; },
    'auto-pack': function (el) { S.settings.autoPack = el.value; ui.autoNote = ''; },
    'auto-qty': function (el) { S.settings.autoQty = +el.value; },
    'auto-claim': function (el) { S.settings.autoClaim = el.checked; },
    'auto-sell': function (el) { S.settings.autoSell = el.checked; },
    instant: function (el) { S.settings.instant = el.checked; },
    vibrate: function (el) { S.settings.vibrate = el.checked; },
    sound: function (el) {
      S.settings.sound = el.checked;
      PG.Sound.set(S.settings.sound, S.settings.volume);
      PG.Sound.play('upgrade');
      openSettings();   // shows or hides the volume slider
    },
    volume: function (el) {
      S.settings.volume = Math.max(0, Math.min(1, +el.value / 100));
      PG.Sound.set(S.settings.sound, S.settings.volume);
      PG.Sound.play('coin');
    },
    profit: function (el) { S.settings.showProfit = el.checked; }
  };

  document.addEventListener('click', function (e) {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const fn = actions[b.dataset.act];
    if (fn) { fn(b, e); updateChrome(); }
  });
  document.addEventListener('change', function (e) {
    const el = e.target.closest('[data-change]');
    if (!el) return;
    const fn = changes[el.dataset.change];
    if (fn) { fn(el); renderView(true); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (ui.sheetOpen) closeSheet();
    else if (ui.overlay && $('.ov-actions', ui.overlay) && !$('.ov-actions', ui.overlay).hidden) closeOverlay();
  });

  // ── View switching ───────────────────────────────────────────────────
  function setTab(tab) {
    if (ui.tab !== tab) window.scrollTo(0, 0);
    ui.tab = tab;
    ui.mounted = null;
    renderView(true);
    updateChrome();
  }

  function renderView(force) {
    const st = PG.stats(S);
    if (ui.tab === 'shop') {
      const key = shopKey(st);
      if (force || ui.mounted !== 'shop' || key !== ui.key) { mountShop(); ui.key = key; ui.mounted = 'shop'; }
      updateShop();
    } else if (ui.tab === 'collection') {
      if (force || ui.mounted !== 'collection' || collectionSig() !== ui.collSig) {
        // Don't rebuild the grid under the reader too often while the auto-opener runs.
        if (force || ui.mounted !== 'collection' || Date.now() - (ui.collAt || 0) > 4000) {
          mountCollection(); ui.mounted = 'collection'; ui.collAt = Date.now();
        }
      }
    } else if (ui.tab === 'storage') {
      if (force || ui.mounted !== 'storage') { mountStorage(); ui.mounted = 'storage'; } else updateStorage(false);
    } else if (ui.tab === 'tech') {
      const key = JSON.stringify(S.tech) + PG.ownedCount(S) + S.medals;
      if (force || ui.mounted !== 'tech' || key !== ui.key) {
        const sc = $('#tree-scroll');
        const left = sc ? sc.scrollLeft : null;
        mountTech(); ui.key = key; ui.mounted = 'tech';
        const sc2 = $('#tree-scroll');
        if (left !== null) sc2.scrollLeft = left;
        else sc2.scrollLeft = Math.max(0, (3.5 * COLW) - sc2.clientWidth / 2);
      } else updateTech();
    } else if (ui.tab === 'stats') {
      const key = statsSig();
      if (force || ui.mounted !== 'stats' || key !== ui.key) { mountStats(); ui.key = key; ui.mounted = 'stats'; }
    }
  }

  // ── Game loop ────────────────────────────────────────────────────────
  function handleEvents(events) {
    events.forEach(function (ev) {
      if (ev.type === 'autoOpen' || ev.type === 'autoFree') {
        ui.autoNote = '';
        const res = ev.result;
        if (!res) return;
        res.results.forEach(function (r) {
          if (r.shiny) { toast('✦ Shiny ' + PG.CARDS[r.id].name + '! +' + fmt(r.shinyCoins) + ' coins', 'gold'); PG.Sound.play('shiny'); }
          if (r.fate !== 'new' && r.fate !== 'star') return;
          ui.feed.unshift({ id: r.id, star: r.star });
          const c = PG.CARDS[r.id];
          if (pullTier(r) >= 15 || (r.star === 5 && c.era >= 2)) {
            toast((r.fate === 'new' ? 'New ' : 'New star: ') + PG.ERAS[c.era].rarity + ' ' + r.star + '★ ' + c.name + '!', 'gold');
          }
        });
        if (ui.feed.length > 12) ui.feed.length = 12;
        renderFeed();
        if (res.won) { if (ui.overlay) ui.pendingWin = true; else openWinSheet(); }
      } else if (ev.type === 'market' && ev.mega) {
        const pack = PG.PACK_BY_ID[ev.mega];
        toast('MEGA SALE! ' + pack.name + ' is on sale. Only ' + PG.RULES.megaStock + ' at this price!', 'gold');
        PG.Sound.play('alert');
        vibrate([40, 40, 40]);
      } else if (ev.type === 'autoWaiting') {
        ui.autoNote = ev.demand ? 'demand' : 'waiting';
      }
    });
  }

  let lastTick = performance.now();
  let lastSave = 0;
  function loop() {
    const now = performance.now();
    let dt = (now - lastTick) / 1000;
    lastTick = now;
    if (dt > 3) {
      // Coming back from sleep or a background tab: only the free-pack timer catches up.
      const made = PG.applyOffline(S, dt);
      if (made) toast('Welcome back! ' + plural(made, 'free pack') + ' ready.', 'gold');
      dt = 0;
    }
    if (dt > 0) handleEvents(PG.tick(S, dt));
    if (now - (ui.dockAt || 0) > 1000) {
      ui.dockAt = now;
      updateDockRoom();   // in case a resize went unnoticed
      // Players without a cloud save hear once per visit how to keep their progress.
      if (!ui.backupTip && PG.Save.cloudState === 'off' && Date.now() - ui.startedAt > (PG.Save.localOK ? 600000 : 60000)) {
        ui.backupTip = true;
        toast(PG.Save.localOK ? 'Tip: your progress is saved on this device only. Copy a backup code in Settings to keep it safe.'
          : 'This app isn’t saving your game. Copy a backup code in Settings before you leave.', 'gold', 7000);
      }
      const got = PG.checkSkins(S);
      if (got.length === 1) toast('New ' + (got[0].kind === 'crate' ? 'crate skin' : 'card back') + ': ' + got[0].name + '! Pick it in Settings.', 'gold');
      else if (got.length) toast(got.length + ' new skins unlocked! Pick them in Settings.', 'gold');
      if (got.length) PG.Sound.play('upgrade');
    }
    PG.Sound.set(S.settings.sound, S.settings.volume);
    updateChrome();
    if (!ui.overlay) renderView(false);
    if (ui.saveReady && now - lastSave > 3000) { lastSave = now; PG.Save.saveLocal(S); PG.Save.pushCloud(S, false); }
  }

  function saveNow() { if (!ui.saveReady) return; PG.Save.saveLocal(S); PG.Save.pushCloud(S, true); }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('pagehide', saveNow);

  // ── Boot ─────────────────────────────────────────────────────────────
  function boot(hotData) {
    let s = hotData && hotData.state ? PG.deserialize(hotData.state) : null;
    let first = false, made = 0;
    if (!s) {
      s = PG.Save.loadLocal();
      if (s && s.savedAt) made = PG.applyOffline(s, (Date.now() - s.savedAt) / 1000);
    }
    if (!s) { s = PG.newState(); first = true; }
    S = s;
    const hash = (location.hash || '').replace('#', '');
    if (['shop', 'collection', 'storage', 'tech', 'stats'].indexOf(hash) >= 0) ui.tab = hash;
    ui.era = Math.max(0, PG.erasUnlocked(S) - 1);
    useDock();
    mountSkinDefs();
    mountChrome();
    setTab(ui.tab);
    if (first) openHelp(true);
    else if (made) toast('Welcome back! ' + plural(made, 'free pack') + ' waiting for you.', 'gold');
    lastTick = performance.now();
    setInterval(loop, 100);
    // The IndexedDB copy may have survived when localStorage didn't (or be newer). Saving
    // waits for this check, so a fresh start can't overwrite that copy first.
    const ready = function () { ui.saveReady = true; };
    setTimeout(ready, 4000);
    PG.Save.loadBackup().then(function (b) {
      if (b && b.savedAt > (S.savedAt || 0) && !ui.saveReady) adoptState(b, 'Welcome back! Your progress was restored.');
      ready();
    });
    PG.Save.initCloud(function () { return S; }, function (remote) {
      adoptState(remote, 'Loaded your newer save from your Claude account.');
    });
  }

  // Switches to another save: a restored backup code, or a newer copy found at start.
  function adoptState(s, msg) {
    if (ui.overlay) { ui.pendingWin = false; closeOverlay(); }
    closeSheet();
    S = s;
    PG.applyOffline(S, (Date.now() - (S.savedAt || Date.now())) / 1000);
    ui.feed = [];
    ui.era = Math.max(0, PG.erasUnlocked(S) - 1);
    setTab(ui.tab);
    ui.saveReady = true;
    saveNow();
    toast(msg, 'good', 4000);
  }

  // ── Backup codes ─────────────────────────────────────────────────────
  function openBackup() {
    PG.Save.exportCode(S).then(function (code) {
      openSheet('Backup code', '<p>This code is your whole game. Keep it somewhere safe, like your Notes app or a message to yourself. ' +
        'To get your progress back on any device, open Settings, tap <b>Restore from code</b> and paste it.</p>' +
        '<textarea class="code" id="backup-code" rows="5" readonly spellcheck="false">' + esc(code) + '</textarea>' +
        '<div class="stack"><button class="btn primary" type="button" data-act="copy-code">Copy code</button>' +
        '<button class="btn" type="button" data-act="close-sheet">Done</button></div>');
    });
  }
  function copyCode() {
    const ta = $('#backup-code');
    if (!ta) return;
    const done = function () { toast('Backup code copied. Paste it somewhere safe.', 'good', 3500); };
    const byHand = function () {
      // Older and embedded browsers: select the text and use the copy command.
      ta.readOnly = false;
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      ta.readOnly = true;
      if (ok) done(); else toast('Select all of the code and copy it.', 'bad', 4000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, byHand);
    else byHand();
  }
  function openRestore() {
    const have = PG.ownedCount(S);
    openSheet('Restore from code', '<p>Paste a backup code to load that game.' +
      (have ? ' It replaces the progress on this device (' + plural(have, 'weapon') + ').' : '') + '</p>' +
      '<textarea class="code" id="restore-code" rows="5" placeholder="AOA1.…" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>' +
      '<div class="stack"><button class="btn primary" type="button" data-act="restore-go">Restore</button>' +
      '<button class="btn" type="button" data-act="close-sheet">Cancel</button></div>');
  }

  // Exposed for tests and the console.
  PG.UI = { fmt: fmt, chance: chance, state: function () { return S; } };

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(function () { return { state: S ? PG.serialize(S) : null }; });
  if (hot && typeof hot.ready === 'function') hot.ready(boot);
  else boot((hot && hot.data) || {});
})(globalThis.PG = globalThis.PG || {});
</script>
<!-- PAGE:END -->
</body>
</html>
